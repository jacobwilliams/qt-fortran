    { sig = "glReadPixel(x: int, y: int) -> QColor", cpp = "qtf_gl_read_pixel({x}, {y})", doc = "The color of one pixel of the current framebuffer (from the bottom left), e.g. to check rendering." },
    { sig = "glClear(mask: int)", cpp = "if (auto *f = qtf_gl()) f->glClear(GLbitfield({mask}))", doc = "Clear buffers, e.g. ior(GL_COLOR_BUFFER_BIT, GL_DEPTH_BUFFER_BIT)." },
    { sig = "glEnable(cap: int)", cpp = "if (auto *f = qtf_gl()) f->glEnable(GLenum({cap}))", doc = "Enable a capability, e.g. GL_DEPTH_TEST." },
    { sig = "glDisable(cap: int)", cpp = "if (auto *f = qtf_gl()) f->glDisable(GLenum({cap}))", doc = "Disable a capability." },
    { sig = "glViewport(x: int, y: int, width: int, height: int)", cpp = "if (auto *f = qtf_gl()) f->glViewport({x}, {y}, {width}, {height})", doc = "Set the viewport (QtfOpenGLWidget sets it to the whole widget before paintGL)." },
    { sig = "glDrawArrays(mode: int, first: int, count: int)", cpp = "if (auto *f = qtf_gl()) f->glDrawArrays(GLenum({mode}), {first}, {count})", doc = "Draw `count` vertices starting at `first` from the bound buffers (mode: GL_TRIANGLES, GL_LINES, ...)." },
    { sig = "glDrawElements(mode: int, count: int, type: int, offset: int = 0)", cpp = "if (auto *f = qtf_gl()) f->glDrawElements(GLenum({mode}), {count}, GLenum({type}), reinterpret_cast<const void *>(qintptr({offset})))", doc = "Draw `count` indexed vertices from the bound index buffer (type: GL_UNSIGNED_INT; offset in bytes)." },
    { sig = "glLineWidth(width: double)", cpp = "if (auto *f = qtf_gl()) f->glLineWidth(GLfloat({width}))", doc = "Set the line width in pixels (core profiles may only support 1)." },
    { sig = "glBlendFunc(sfactor: int, dfactor: int)", cpp = "if (auto *f = qtf_gl()) f->glBlendFunc(GLenum({sfactor}), GLenum({dfactor}))", doc = "Set the blending factors, e.g. GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA." },
    { sig = "glDepthFunc(func: int)", cpp = "if (auto *f = qtf_gl()) f->glDepthFunc(GLenum({func}))", doc = "Set the depth comparison, e.g. GL_LESS (default) or GL_LEQUAL." },
    { sig = "glDepthMask(flag: bool)", cpp = "if (auto *f = qtf_gl()) f->glDepthMask(GLboolean({flag}))", doc = "Enable or disable writing to the depth buffer." },
    { sig = "glCullFace(mode: int)", cpp = "if (auto *f = qtf_gl()) f->glCullFace(GLenum({mode}))", doc = "Select which faces are culled (GL_BACK or GL_FRONT) when GL_CULL_FACE is enabled." },
    { sig = "glFrontFace(mode: int)", cpp = "if (auto *f = qtf_gl()) f->glFrontFace(GLenum({mode}))", doc = "Set the winding of front faces (GL_CCW, the default, or GL_CW)." },
    { sig = "glPolygonOffset(factor: double, units: double)", cpp = "if (auto *f = qtf_gl()) f->glPolygonOffset(GLfloat({factor}), GLfloat({units}))", doc = "Set the depth offset used when GL_POLYGON_OFFSET_FILL is enabled." },
    { sig = "glFlush()", cpp = "if (auto *f = qtf_gl()) f->glFlush()", doc = "Start executing queued commands." },
    { sig = "glFinish()", cpp = "if (auto *f = qtf_gl()) f->glFinish()", doc = "Block until all queued commands have completed." },
    { sig = "glGetError() -> int", cpp = "qtf_gl() ? int(qtf_gl()->glGetError()) : 0", doc = "The oldest recorded error (GL_NO_ERROR if none)." },
    { sig = "glGetString(name: int) -> string", cpp = "qtf_gl_string({name})", doc = "A context string: GL_VERSION, GL_RENDERER, GL_VENDOR or GL_SHADING_LANGUAGE_VERSION." },
