[[class]]
name = "QtfOpenGLWidget"
base = "QWidget"
doc = """
An OpenGL widget whose virtual functions are delivered to Fortran slots, the
qt-fortran counterpart of subclassing QOpenGLWidget (`Qtf` marks a qt-fortran
class). Qt makes the widget's context current before `initializeGL`,
`resizeGL` and `paintGL`, and sets the viewport to the whole widget before
`paintGL`. Call `update()` to request a repaint.

Input events work as in QtfWidget; the widget accepts keyboard focus."""
ctor = "(parent: QWidget?) -- Create an OpenGL widget; without a parent it is a top-level window."
signals = [
    { sig = "initializeGL: void", doc = "Set up resources (shaders, buffers); called once, before the first resizeGL / paintGL.", connector = "connect_gl_event<QTF_GL_INITIALIZE>" },
    { sig = "resizeGL: void", doc = "The widget was resized; query `width()` / `height()`.", connector = "connect_gl_event<QTF_GL_RESIZE>" },
    { sig = "paintGL: void", doc = "Render the scene.", connector = "connect_gl_event<QTF_GL_PAINT>" },
    { sig = "mousePressEvent: mouse", doc = "Mouse button pressed.", connector = "connect_gl_event<QTF_GL_MOUSEPRESS>" },
    { sig = "mouseReleaseEvent: mouse", doc = "Mouse button released.", connector = "connect_gl_event<QTF_GL_MOUSERELEASE>" },
    { sig = "mouseMoveEvent: mouse", doc = "Mouse moved.", connector = "connect_gl_event<QTF_GL_MOUSEMOVE>" },
    { sig = "mouseDoubleClickEvent: mouse", doc = "Mouse button double-clicked.", connector = "connect_gl_event<QTF_GL_MOUSEDOUBLECLICK>" },
    { sig = "wheelEvent: wheel", doc = "Wheel turned.", connector = "connect_gl_event<QTF_GL_WHEEL>" },
    { sig = "keyPressEvent: key", doc = "Key pressed.", connector = "connect_gl_event<QTF_GL_KEYPRESS>" },
    { sig = "keyReleaseEvent: key", doc = "Key released.", connector = "connect_gl_event<QTF_GL_KEYRELEASE>" },
]
methods = [
    "makeCurrent() -- Make the widget's context current (for GL calls outside its slots).",
    "doneCurrent() -- Release the widget's context.",
    "isValid() -> bool -- True once the widget has a working OpenGL context.",
