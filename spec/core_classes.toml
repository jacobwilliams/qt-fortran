doc = """
Watches files and directories for changes made by any program, e.g. to
reload an open file or refresh a project tree. `fileChanged` reports a
modified, renamed or deleted file; `directoryChanged` a directory whose
entries changed (a file added, removed or renamed in it). Many editors save
by replacing the file, which removes it from the watch list: add it again in
the slot if it still exists. Signals arrive through the event loop."""
ctor = "(parent: QObject?) -- A watcher with nothing to watch yet."
signals = [
    { sig = "fileChanged: string", doc = "A watched file was modified, renamed or deleted: its path." },
    { sig = "directoryChanged: string", doc = "The entries of a watched directory changed: its path." },
]
