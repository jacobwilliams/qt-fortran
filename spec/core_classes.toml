[[class]]
name = "QNetworkRequest"
handle = true
doc = """
What to fetch or send with a QNetworkAccessManager: a URL (http, https,
file, data, ...), headers and options. Redirects are followed (except from
https to http). Delete it when done (the manager copies it)."""
ctor = "(url: string = '') -- A request for `url`."
cpp_ctor = "new QNetworkRequest(QUrl({url}))"
methods = [
    { sig = "setUrl(url: string)", cpp = "{self}->setUrl(QUrl({url}))", doc = "The URL." },
    { sig = "url() -> string", cpp = "{self}->url().toString()", doc = "The URL." },
    { sig = "setRawHeader(name: string, value: string)", cpp = "{self}->setRawHeader({name}.toUtf8(), {value}.toUtf8())", doc = "Set a header, e.g. ('Content-Type', 'application/json') or ('Authorization', 'Bearer ...')." },
    { sig = "rawHeader(name: string) -> string", cpp = "QString::fromUtf8({self}->rawHeader({name}.toUtf8()))", doc = "A header's value ('' if not set)." },
    { sig = "setTransferTimeout(msecs: int)", cpp = "{self}->setTransferTimeout(std::chrono::milliseconds({msecs}))", doc = "Abort (QNetworkReply_OperationCanceledError) if no data moves for `msecs` (0: no timeout)." },
    { sig = "setFollowRedirects(follow: bool)", cpp = "{self}->setAttribute(QNetworkRequest::RedirectPolicyAttribute, {follow} ? QNetworkRequest::NoLessSafeRedirectPolicy : QNetworkRequest::ManualRedirectPolicy)", doc = "Follow redirects (default) or return them (status 301/302, `rawHeader('Location')`)." },
]
