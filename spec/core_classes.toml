# Bindings for QtCore classes beyond the hand-written src/core/qt_core.f90.
# `pixi run gen` turns this into shim/qtf_core_classes.cpp and
# src/core/qt_core_classes.f90 (see tools/gen_bindings.py for the format).

module = "core_classes"
src_dir = "core"
signal_base = 4000
doc = """
QtCore classes: persistent application settings (QSettings), worker
threads (QThread), external programs (QProcess, QProcessEnvironment),
watching files for changes (QFileSystemWatcher), event-loop notifications
for file descriptors and Windows handles (QSocketNotifier, QWinEventNotifier),
safe file writing (QSaveFile), temporary directories (QTemporaryDir), JSON
(QJsonDocument, QJsonObject, QJsonArray, QJsonValue), HTTP and other URLs
(QNetworkAccessManager, QNetworkRequest, QNetworkReply; QtNetwork), and
portable directory functions (QDir_*), which standard Fortran lacks.
"""
uses = [
    "use qt_c_util",
    "use qt_c_core_classes",
    "use qt_core",
]
cpp_includes = ["QDir", "QSettings", "QStringList", "QThread", "QVariant", "QProcess", "QProcessEnvironment", "QFileSystemWatcher", "QFileInfo", "QSocketNotifier", "QCoreApplication", "QTemporaryDir", "QSaveFile", "QJsonDocument", "QJsonObject", "QJsonArray", "QJsonValue", "QNetworkAccessManager", "QNetworkRequest", "QNetworkReply", "QEventLoop", "QTimer", "QUrl", "algorithm", "cstdlib", "cstring"]

cpp_prelude = """
// Runs (op 0) or frees (op 1) the Fortran task of a thread.
typedef void (*qtf_task_fn)(void *task, int op);
static qtf_task_fn qtf_task_runner = nullptr;

// Set the Fortran procedure that runs and frees thread tasks.
QTF_API void qtf_set_task_runner(qtf_task_fn fn) { qtf_task_runner = fn; }

// A thread whose run() calls a Fortran procedure (QThread_create). Destroying
// it while it runs requests interruption and waits, instead of aborting.
class QtfThread : public QThread {
  public:
    QtfThread(void *task, QObject *parent) : QThread(parent), task(task) {}
    ~QtfThread() override {
        requestInterruption();
        wait();
        if (qtf_task_runner) qtf_task_runner(task, 1);
    }

  protected:
    void run() override {
        if (qtf_task_runner) qtf_task_runner(task, 0);
    }

  private:
    void *task;
};

// Wait for the thread to finish; msecs < 0 waits without a time limit.
static void qtf_thread_wait(QThread *t, int msecs) {
    if (msecs < 0) t->wait();
    else t->wait(QDeadlineTimer(msecs));
}

// Bytes for Fortran: a malloc'd copy (released by qtf_free) and its length.
// Process output is passed as raw bytes, not decoded and re-encoded.
static char *qtf_bytes(const QByteArray &b, int *len) {
    *len = static_cast<int>(b.size());
    char *p = static_cast<char *>(std::malloc(b.size() + 1));
    std::memcpy(p, b.constData(), b.size());
    p[b.size()] = 0;
    return p;
}

// A new thread that will run the Fortran task `task`, owned by `parent` if given.
QTF_API void *qtf_qthread_create(void *task, void *parent) {
    return new QtfThread(task, static_cast<QObject *>(parent));
}

// QWinEventNotifier exists only on Windows. Elsewhere a stand-in keeps the
// same API but never fires, so portable code compiles everywhere.
#ifdef Q_OS_WIN
#include <QWinEventNotifier>
static bool qtf_win_supported() { return true; }
#else
class QWinEventNotifier : public QObject {
  public:
    QWinEventNotifier(void *handle, QObject *parent) : QObject(parent), h(handle) {}
    void setHandle(void *handle) { h = handle; }
    void *handle() const { return h; }
    void setEnabled(bool e) { enabled = e; }
    bool isEnabled() const { return enabled; }

  private:
    void *h;
    bool enabled = true;
};
static bool qtf_win_supported() { return false; }
#endif

// Attach a slot to QWinEventNotifier::activated (a no-op where it never fires).
static bool connect_win_notifier(void *s, const qtf_slot &ref) {
#ifdef Q_OS_WIN
    auto *n = static_cast<QWinEventNotifier *>(s);
    return qtf_track(ref, QObject::connect(n, &QWinEventNotifier::activated, n, [ref](HANDLE) { qtf_emit(ref); }));
#else
    (void)s;
    (void)ref;
    return true;
#endif
}

// A JSON document with the result of parsing it (QJsonDocument_fromJson).
// Every QJsonDocument handle is one of these.
class QtfJsonDocument : public QJsonDocument {
  public:
    QtfJsonDocument() = default;
    explicit QtfJsonDocument(const QJsonDocument &d) : QJsonDocument(d) {}
    QString error;
    int offset = -1;
};

static QtfJsonDocument *qtf_jdoc(QJsonDocument *d) { return static_cast<QtfJsonDocument *>(d); }

static QJsonDocument *qtf_json_parse(const QString &text) {
    QJsonParseError e;
    auto *d = new QtfJsonDocument(QJsonDocument::fromJson(text.toUtf8(), &e));
    if (e.error != QJsonParseError::NoError) {
        d->error = e.errorString();
        d->offset = e.offset;
    }
    return d;
}

static QString qtf_json_text(const QJsonDocument &d, bool compact) {
    return QString::fromUtf8(d.toJson(compact ? QJsonDocument::Compact : QJsonDocument::Indented));
}

// The integers of a JSON array (non-numbers as 0).
static QList<int> qtf_json_ints(const QJsonArray *a) {
    QList<int> v;
    for (const QJsonValue &x : *a) v << x.toInt(int(x.toDouble()));
    return v;
}

// Byte counts for int signal arguments (clamped to the int range).
static int qtf_clamp_int(qint64 v) { return int(std::clamp<qint64>(v, -2147483647, 2147483647)); }

// Run the event loop until the reply finishes or `msecs` pass (< 0: no limit).
static bool qtf_wait_reply(QNetworkReply *r, int msecs) {
    if (r->isFinished()) return true;
    QEventLoop loop;
    QTimer timer;
    timer.setSingleShot(true);
    QObject::connect(r, &QNetworkReply::finished, &loop, &QEventLoop::quit);
    QObject::connect(&timer, &QTimer::timeout, &loop, &QEventLoop::quit);
    if (msecs >= 0) timer.start(msecs);
    loop.exec();
    return r->isFinished();
}

static QStringList qtf_header_names(const QNetworkReply *r) {
    QStringList names;
    for (const QByteArray &h : r->rawHeaderList()) names << QString::fromUtf8(h);
    return names;
}
"""

