    "processId() -> int64 -- The program's process id (0 if it is not running).",
    { sig = "static execute(program: string, arguments: strings) -> int", doc = "Run `program` with `arguments`, wait for it to finish, and return its exit code (-2: it could not be started, -1: it crashed). Its output goes to this program's own standard output and error." },
    { sig = "static splitCommand(command: string) -> strings", doc = "Split a command line into words as `startCommand` does: spaces separate words, double quotes group them." },
    { sig = "static nullDevice() -> string", doc = "The null device ('/dev/null', or 'NUL' on Windows), e.g. to discard output with `setStandardOutputFile`." },
]
cpp = """
// All standard output read so far, as bytes.
QTF_API char *qtf_qprocess_readAllStandardOutput(void *self, int *len) {
    return qtf_bytes(as<QProcess>(self)->readAllStandardOutput(), len);
}

// All standard error output read so far, as bytes.
QTF_API char *qtf_qprocess_readAllStandardError(void *self, int *len) {
    return qtf_bytes(as<QProcess>(self)->readAllStandardError(), len);
}

// Everything available in the current read channel, as bytes.
QTF_API char *qtf_qprocess_readAll(void *self, int *len) { return qtf_bytes(as<QProcess>(self)->readAll(), len); }

// One line from the current read channel, without its line break ("\\n" or "\\r\\n").
QTF_API char *qtf_qprocess_readLine(void *self, int *len) {
    QByteArray line = as<QProcess>(self)->readLine();
    if (line.endsWith('\\n')) line.chop(1);
    if (line.endsWith('\\r')) line.chop(1);
    return qtf_bytes(line, len);
}
"""
fortran_bindings = """
procedure :: readAllStandardOutput => qprocess_readAllStandardOutput
procedure :: readAllStandardError => qprocess_readAllStandardError
procedure :: readAll => qprocess_readAll
procedure :: readLine => qprocess_readLine
"""
fortran_procedures = """
    !> The standard output received since the last read (bytes, as the program wrote them).
    function qprocess_readAllStandardOutput(self) result(res)
        class(QProcess), intent(in) :: self
        character(len=:), allocatable :: res
        integer(c_int) :: n
        type(c_ptr) :: p
        p = qtf_qprocess_readAllStandardOutput(qtf_live(self, 'QProcess%readAllStandardOutput'), n)
        res = qtf_take_string(p, n)
    end function qprocess_readAllStandardOutput

    !> The standard error output received since the last read.
    function qprocess_readAllStandardError(self) result(res)
        class(QProcess), intent(in) :: self
        character(len=:), allocatable :: res
        integer(c_int) :: n
        type(c_ptr) :: p
        p = qtf_qprocess_readAllStandardError(qtf_live(self, 'QProcess%readAllStandardError'), n)
        res = qtf_take_string(p, n)
    end function qprocess_readAllStandardError

    !> Everything waiting in the current read channel (see `setReadChannel`).
    function qprocess_readAll(self) result(res)
        class(QProcess), intent(in) :: self
        character(len=:), allocatable :: res
        integer(c_int) :: n
        type(c_ptr) :: p
        p = qtf_qprocess_readAll(qtf_live(self, 'QProcess%readAll'), n)
        res = qtf_take_string(p, n)
    end function qprocess_readAll

    !> The next line of the current read channel, without its line break
    !> (check `canReadLine()` first; at the end of the output, what is left).
    function qprocess_readLine(self) result(res)
        class(QProcess), intent(in) :: self
        character(len=:), allocatable :: res
        integer(c_int) :: n
        type(c_ptr) :: p
        p = qtf_qprocess_readLine(qtf_live(self, 'QProcess%readLine'), n)
        res = qtf_take_string(p, n)
    end function qprocess_readLine
"""

[[class]]
