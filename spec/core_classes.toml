[[class]]
name = "QSocketNotifier"
doc = """
Calls a slot from the event loop when a file descriptor has data to read
(or can be written), e.g. the output of a pseudo-terminal or a pipe, so the
GUI never blocks waiting for it. In the `activated` slot, read what is
available. While data stays unread the notifier fires again, so read it
all, or `setEnabled(.false.)` until you can. On Windows it works only for
sockets: use QWinEventNotifier (or a thread) for pipes and consoles."""
