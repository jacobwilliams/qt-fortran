    { sig = "write(data: string, size: int = -1) -> int64", cpp = "static_cast<long long>({self}->write(data, {size} < 0 ? data_len : std::min({size}, data_len)))", doc = "Write the bytes of `data` as they are (binary safe), or only its first `size` bytes; returns the number written, or -1 on error." },
    { sig = "writeDoubles(values: double[]) -> int64", cpp = "static_cast<long long>({self}->write(reinterpret_cast<const char *>({values}), qint64({n}) * qint64(sizeof(double))))", doc = "Write an array of doubles as raw bytes (native byte order); returns the number of bytes written, or -1." },
    { sig = "writeInts(values: int[]) -> int64", cpp = "static_cast<long long>({self}->write(reinterpret_cast<const char *>({values}), qint64({n}) * qint64(sizeof(int))))", doc = "Write an array of (32-bit) integers as raw bytes (native byte order); returns the number of bytes written, or -1." },
    "commit() -> bool -- Close the file and replace the target with it; false if any write failed (the target is unchanged).",
