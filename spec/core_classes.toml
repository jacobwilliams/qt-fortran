[[class]]
name = "QNetworkReply"
doc = """
The answer to a request: connect `finished` (and `downloadProgress`, ...)
and read the body with `readAll` in the slot; or, in scripts and tests,
`waitForFinished`. The manager owns replies: call `deleteLater` when done
with one (not `delete` inside its own slot)."""
signals = [
    "finished: void -- The reply is complete (successfully or not: check `error`).",
    "readyRead: void -- More of the body arrived (read it with `readAll` to stream it).",
    { sig = "errorOccurred: custom", fortran_type = "QSignalInt", lambda = "QNetworkReply::NetworkError e", emit = "qtf_emit_int(ref, int(e))", doc = "An error: a QNetworkReply_* code (`finished` follows)." },
    { sig = "downloadProgress: custom", fortran_type = "QSignalInt2", lambda = "qint64 received, qint64 total", emit = "qtf_emit_ints(ref, {qtf_clamp_int(received), qtf_clamp_int(total)})", doc = "Bytes received so far, and the total (-1 if unknown)." },
    { sig = "uploadProgress: custom", fortran_type = "QSignalInt2", lambda = "qint64 sent, qint64 total", emit = "qtf_emit_ints(ref, {qtf_clamp_int(sent), qtf_clamp_int(total)})", doc = "Bytes sent so far, and the total." },
]
methods = [
    { sig = "waitForFinished(msecs: int = 30000) -> bool", cpp = "qtf_wait_reply({self}, {msecs})", doc = "Run the event loop until the reply finishes (slots keep running) or `msecs` pass (< 0: no limit); true if finished." },
    "isFinished() -> bool -- True when complete.",
    "isRunning() -> bool -- True while in progress.",
    { sig = "error() -> int", cpp = "int({self}->error())", doc = "QNetworkReply_NoError, or what went wrong (QNetworkReply_* codes; for HTTP errors also see `statusCode`)." },
    "errorString() -> string -- The error, as text.",
    "abort() -- Stop now (error QNetworkReply_OperationCanceledError).",
    { sig = "url() -> string", cpp = "{self}->url().toString()", doc = "The URL (after redirects)." },
    { sig = "statusCode() -> int", cpp = "{self}->attribute(QNetworkRequest::HttpStatusCodeAttribute).toInt()", doc = "The HTTP status code (200, 404, ...). Other schemes may report 200 or 0: check `error` for them." },
    { sig = "reasonPhrase() -> string", cpp = "{self}->attribute(QNetworkRequest::HttpReasonPhraseAttribute).toString()", doc = "The HTTP reason phrase ('OK', 'Not Found', ...)." },
    { sig = "rawHeader(name: string) -> string", cpp = "QString::fromUtf8({self}->rawHeader({name}.toUtf8()))", doc = "A response header ('' if absent)." },
    { sig = "hasRawHeader(name: string) -> bool", cpp = "{self}->hasRawHeader({name}.toUtf8())", doc = "True if the response has this header." },
    { sig = "rawHeaderNames() -> strings", cpp = "qtf_header_names({self})", doc = "The names of the response headers." },
    { sig = "contentType() -> string", cpp = "{self}->header(QNetworkRequest::ContentTypeHeader).toString()", doc = "The Content-Type ('' if unknown)." },
    { sig = "bytesAvailable() -> int64", cpp = "static_cast<long long>({self}->bytesAvailable())", doc = "Bytes received and not yet read." },
]
cpp = """
// The body received so far (bytes, as they came).
QTF_API char *qtf_qnetworkreply_readAll(void *self, int *len) { return qtf_bytes(as<QNetworkReply>(self)->readAll(), len); }
"""
fortran_bindings = "procedure :: readAll => qnetworkreply_readAll"
fortran_procedures = """
    !> The body received since the last read (bytes, as they came: e.g. UTF-8 text, or binary data).
    function qnetworkreply_readAll(self) result(res)
        class(QNetworkReply), intent(in) :: self
        character(len=:), allocatable :: res
        integer(c_int) :: n
        type(c_ptr) :: p
        p = qtf_qnetworkreply_readAll(qtf_live(self, 'QNetworkReply%readAll'), n)
        res = qtf_take_string(p, n)
    end function qnetworkreply_readAll
"""

[[class]]
name = "QNetworkAccessManager"
doc = """
Sends requests (QNetworkRequest) and returns their replies (QNetworkReply),
asynchronously: the program keeps running and the reply's `finished` slot
gets the result. One manager per application is enough. Bodies (`post`,
`put`) are bytes, sent as they are: set the Content-Type header.

    req = QNetworkRequest('https://api.example.com/items')
    reply = manager%get(req)
    call req%delete()
    call reply%finished%connect(on_items, state)"""
ctor = "(parent: QObject?) -- A network access manager."
methods = [
    { sig = "get(request: QNetworkRequest) -> QNetworkReply", cpp = "{self}->get(*{request})", doc = "Fetch a URL." },
    { sig = "head(request: QNetworkRequest) -> QNetworkReply", cpp = "{self}->head(*{request})", doc = "Fetch only the headers." },
    { sig = "post(request: QNetworkRequest, data: string) -> QNetworkReply", cpp = "{self}->post(*{request}, QByteArray(data, data_len))", doc = "Send `data` (bytes) with POST." },
    { sig = "put(request: QNetworkRequest, data: string) -> QNetworkReply", cpp = "{self}->put(*{request}, QByteArray(data, data_len))", doc = "Send `data` (bytes) with PUT." },
    { sig = "deleteResource(request: QNetworkRequest) -> QNetworkReply", cpp = "{self}->deleteResource(*{request})", doc = "Send a DELETE request." },
    { sig = "sendCustomRequest(request: QNetworkRequest, verb: string, data: string = '') -> QNetworkReply", cpp = "{self}->sendCustomRequest(*{request}, {verb}.toUtf8(), QByteArray(data, data_len))", doc = "Send a request with another HTTP verb (e.g. 'PATCH') and an optional body." },
    { sig = "setTransferTimeout(msecs: int)", cpp = "{self}->setTransferTimeout(std::chrono::milliseconds({msecs}))", doc = "The default transfer timeout of its requests (0: none)." },
]
