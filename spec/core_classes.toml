[[class]]
name = "QProcess"
doc = """
Runs an external program (a compiler, fpm, git, a language server, ...) and
talks to it through its standard input, output and error.

```fortran
proc = QProcess(window)
call proc%readyReadStandardOutput%connect(on_output, state)   ! read it as it comes
call proc%finished%connect(on_finished, state)                ! (exitCode, exitStatus)
call proc%setWorkingDirectory(project_dir)
call proc%start('fpm', [character(len=5) :: 'build'])
```

The program is found on the PATH (or given as a path), and its arguments
are passed as they are, without a shell (to run a shell command line, start
`sh` with `['-c', line]`, or `cmd` with `['/c', line]` on Windows). Starting
returns at once: the process runs alongside the event loop, and its signals
arrive in slots. Outside an event loop (scripts, tests) wait with
`waitForStarted` / `waitForFinished` instead, which return false on a
timeout (default 30 s; -1: none).

Output is read as raw bytes (`readAllStandardOutput`, `readLine`, ...),
so text in any encoding comes through unchanged. Standard output and
error are kept apart unless `setProcessChannelMode(QProcess_MergedChannels)`.
Input is sent with `write`, and `closeWriteChannel` signals its end.

A process failing to start is reported to `errorOccurred`
(QProcess_FailedToStart), not to `finished`. Deleting a QProcess kills a
program that is still running."""
ctor = "(parent: QObject?) -- A process object (nothing runs until `start`)."
signals = [
    "started: void -- The program has started.",
    "finished: int2 -- The program has finished: slots get (exitCode, exitStatus), exitStatus QProcess_NormalExit or QProcess_CrashExit.",
    "errorOccurred: int -- An error occurred: slots get a QProcess_* error (QProcess_FailedToStart, _Crashed, _Timedout, ...).",
    "stateChanged: int -- The state changed: slots get QProcess_NotRunning, QProcess_Starting or QProcess_Running.",
    "readyReadStandardOutput: void -- New standard output can be read.",
    "readyReadStandardError: void -- New standard error output can be read.",
    "readyRead: void -- New data can be read from the current read channel (`setReadChannel`).",
]
methods = [
    "setProgram(program: string) -- The program to run with `start()` (a name found on the PATH, or a path).",
    "program() -> string -- The program.",
    "setArguments(arguments: strings) -- The arguments for `start()`, passed as they are (no shell quoting).",
    "arguments() -> strings -- The arguments.",
    { sig = "start()", cpp = "{self}->start()", doc = "Start the program set with `setProgram` and `setArguments`." },
    { sig = "startProgram(program: string)", fortran_name = "start", cpp = "{self}->start({program}, QStringList())", doc = "Start `program` without arguments." },
    { sig = "startWithArguments(program: string, arguments: strings)", fortran_name = "start", cpp = "{self}->start({program}, {arguments})", doc = "Start `program` with `arguments` (passed as they are, without a shell)." },
    "startCommand(command: string) -- Start a command line, split into the program and its arguments as `QProcess_splitCommand` does (quotes group words; no shell features such as pipes).",
    { sig = "startDetached() -> bool", cpp = "{self}->startDetached()", doc = "Start the program set with `setProgram` etc. as an independent process that keeps running after this program exits; no output is read and no signals are emitted. False if it could not be started." },
    "waitForStarted(msecs: int = 30000) -> bool -- Wait until the program has started (or failed to); false on failure or timeout (-1: no timeout).",
    "waitForFinished(msecs: int = 30000) -> bool -- Wait until the program has finished; false on timeout, failure or if it was not running. Signals are emitted during the wait.",
    "waitForReadyRead(msecs: int = 30000) -> bool -- Wait until new output can be read; false on timeout or when the program has finished.",
    "waitForBytesWritten(msecs: int = 30000) -> bool -- Wait until written input has been passed to the program.",
    "terminate() -- Ask the program to exit (SIGTERM on Unix, WM_CLOSE on Windows); it may ignore the request.",
