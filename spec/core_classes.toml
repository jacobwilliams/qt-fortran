    "removePath(path: string) -> bool -- Stop watching a path; false if it was not watched.",
    "removePaths(paths: strings) -> strings -- Stop watching several; returns the paths that were not watched.",
    "files() -> strings -- The watched files.",
    "directories() -> strings -- The watched directories.",
]

