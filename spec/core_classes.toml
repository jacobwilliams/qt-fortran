        self%ptr = c_null_ptr
    end subroutine qjsonarray_delete

    !> The elements as real(c_double) numbers (other kinds as `fallback`, default 0).
    function qjsonarray_toDoubles(self, fallback) result(res)
        class(QJsonArray), intent(in) :: self
        real(c_double), intent(in), optional :: fallback
        real(c_double), allocatable :: res(:)
        real(c_double) :: f
        integer :: i
        f = 0.0_c_double
        if (present(fallback)) f = fallback
        allocate(res(self%size()))
        do i = 1, size(res)
            res(i) = self%doubleAt(i - 1, f)
        end do
    end function qjsonarray_toDoubles
"""

