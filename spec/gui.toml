[[class]]
name = "QMimeData"
doc = """
Data with MIME types, for drag and drop and the clipboard: text, HTML, URLs
(file paths), an image, or any `format` as text. A QDrag or QClipboard that is
given it takes ownership; otherwise delete it."""
ctor = "() -- Empty data."
methods = [
    "setText(text: string) -- Set the plain text (text/plain).",
    "text() -> string -- The plain text.",
    "hasText() -> bool -- True if there is plain text.",
    "setHtml(html: string) -- Set HTML (text/html).",
    "html() -> string -- The HTML.",
    "hasHtml() -> bool -- True if there is HTML.",
    { sig = "setUrls(urls: strings)", cpp = "{self}->setUrls(qtf_urls({urls}))", doc = "Set URLs (text/uri-list): file paths, or URLs such as 'https://...'." },
    { sig = "urls() -> strings", cpp = "qtf_url_strings({self}->urls())", doc = "The URLs: local files as paths." },
    "hasUrls() -> bool -- True if there are URLs (e.g. files dropped from the desktop).",
    { sig = "setImage(image: QImage)", cpp = "{self}->setImageData(*{image})", doc = "Set an image (copied)." },
    { sig = "image() -> QImage", cpp = "new QImage(qvariant_cast<QImage>({self}->imageData()))", doc = "A copy of the image (null if none; delete it when done)." },
    "hasImage() -> bool -- True if there is an image.",
    { sig = "setData(format: string, data: string)", cpp = "{self}->setData({format}, {data}.toUtf8())", doc = "Set data of any MIME type `format` (e.g. 'application/x-mydata') as UTF-8 text." },
    { sig = "data(format: string) -> string", cpp = "QString::fromUtf8({self}->data({format}))", doc = "The data of `format` as text (empty if none)." },
    "hasFormat(format: string) -> bool -- True if there is data of MIME type `format`.",
    "formats() -> strings -- The MIME types present.",
    "clear() -- Remove all data.",
    { sig = "hasItems() -> bool", cpp = "{self}->hasFormat(QStringLiteral(QTF_MIME_ITEMS))", doc = "True if the data holds items dragged from a QtfTableModel, QtfListModel or QtfTreeModel (MIME type 'application/x-qtf-items')." },
    { sig = "items() -> int[]", cpp = "qtf_items({self})", doc = "The rows (table, list) or nodes (tree) of the dragged items, in order (empty if none). The model's `isDragSource` tells which model they come from." },
]

[[class]]
name = "QDropEvent"
base = "QEvent"
handle = true
doc = """
A drag entering, moving over or dropped on a widget (QWidget's
dragEnterEvent, dragMoveEvent and dropEvent; the widget must
`setAcceptDrops(.true.)`). In dragEnterEvent call `acceptProposedAction()`
to accept the drag (otherwise no drop follows); in dropEvent read the data
(`text`, `urls`, ...) and accept it."""
ctor = "(type: QEvent::Type, x: double, y: double, mimeData: QMimeData, actions: Qt::DropActions = Qt_CopyAction, buttons: Qt::MouseButtons = Qt_LeftButton, modifiers: Qt::KeyboardModifiers = Qt_NoModifier) -- A synthetic QEvent_DragEnter, QEvent_DragMove or QEvent_Drop event carrying `mimeData` (not owned: delete both after use), e.g. to test drop handling with QCoreApplication_sendEvent. As in a real drag, a widget gets moves and the drop only after accepting a drag-enter."
cpp_ctor = "qtf_drop_event({type}, {x}, {y}, {mimeData}, {actions}, {buttons}, {modifiers})"
methods = [
    { sig = "x() -> double", cpp = "{self}->position().x()", doc = "Horizontal position in widget coordinates." },
    { sig = "y() -> double", cpp = "{self}->position().y()", doc = "Vertical position in widget coordinates." },
    "position() -> QPointF -- The position in widget coordinates.",
    "proposedAction() -> Qt::DropAction -- The action the user asks for (Qt_CopyAction, _MoveAction, _LinkAction).",
    "possibleActions() -> Qt::DropActions -- The actions the source allows (a combination of Qt_*Action).",
    "dropAction() -> Qt::DropAction -- The action that will be taken.",
    "setDropAction(action: Qt::DropAction) -- Take another (possible) action than the proposed one; then `accept()` the event.",
    "acceptProposedAction() -- Accept the drag or drop with the proposed action.",
    "buttons() -> Qt::MouseButtons -- Mouse buttons held.",
    "modifiers() -> Qt::KeyboardModifiers -- Keyboard modifiers held (e.g. Ctrl to copy).",
    { sig = "mimeData() -> QMimeData", cpp = "const_cast<QMimeData *>(qtf_mime({self}))", doc = "The dragged data (valid during the slot)." },
    { sig = "hasText() -> bool", cpp = "qtf_mime({self})->hasText()", doc = "True if the drag carries plain text." },
    { sig = "text() -> string", cpp = "qtf_mime({self})->text()", doc = "The dragged plain text." },
    { sig = "hasUrls() -> bool", cpp = "qtf_mime({self})->hasUrls()", doc = "True if the drag carries URLs (e.g. files from the desktop)." },
    { sig = "urls() -> strings", cpp = "qtf_url_strings(qtf_mime({self})->urls())", doc = "The dragged URLs: local files as paths." },
    { sig = "hasImage() -> bool", cpp = "qtf_mime({self})->hasImage()", doc = "True if the drag carries an image." },
    { sig = "hasFormat(format: string) -> bool", cpp = "qtf_mime({self})->hasFormat({format})", doc = "True if the drag carries data of MIME type `format`." },
    { sig = "data(format: string) -> string", cpp = "QString::fromUtf8(qtf_mime({self})->data({format}))", doc = "The dragged data of `format`, as text." },
    { sig = "hasItems() -> bool", cpp = "qtf_mime({self})->hasFormat(QStringLiteral(QTF_MIME_ITEMS))", doc = "True if the drag carries items of a QtfTableModel, QtfListModel or QtfTreeModel (dragged from a view)." },
    { sig = "items() -> int[]", cpp = "qtf_items(qtf_mime({self}))", doc = "The rows (table, list) or nodes (tree) being dragged from a Fortran-backed model (empty if none)." },
]

[[class]]
name = "QDrag"
doc = """
Start a drag from a widget, typically in its mouse-move slot once the mouse
has moved far enough: `drag = QDrag(widget)`, `call drag%setMimeData(data)`,
`action = drag%exec(Qt_CopyAction)`. `exec` returns when the drop is done
(the action taken, or Qt_IgnoreAction if cancelled). Delete the drag
afterwards with `deleteLater`."""
ctor = "(source: QObject) -- A drag from `source` (the widget dragged from)."
methods = [
    "setMimeData(data: QMimeData) -- The data to drag (the drag takes ownership).",
    { sig = "setPixmap(pixmap: QPixmap)", cpp = "{self}->setPixmap(*{pixmap})", doc = "The image shown under the cursor (copied)." },
    { sig = "setHotSpot(x: int, y: int)", cpp = "{self}->setHotSpot(QPoint({x}, {y}))", doc = "Where the cursor is on the pixmap." },
    { sig = "setHotSpotPoint(hotSpot: QPoint)", fortran_name = "setHotSpot", cpp = "{self}->setHotSpot({hotSpot})", doc = "Where the cursor is on the pixmap." },
    { sig = "exec(supportedActions: Qt::DropActions = Qt_CopyAction, defaultAction: Qt::DropAction = Qt_IgnoreAction) -> Qt::DropAction", doc = "Run the drag (blocks until it ends); returns the action taken, Qt_IgnoreAction if cancelled." },
]

