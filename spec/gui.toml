    "QAction", "QFontMetrics", "QImage", "QKeyEvent", "QKeySequence", "QMouseEvent", "QPainter",
    "QPixmap", "QPolygonF", "QResizeEvent", "QWheelEvent", "QIcon", "QCloseEvent", "QContextMenuEvent",
    "QWindow",
    "QPainterPath", "QLinearGradient", "QRadialGradient", "QConicalGradient", "QTransform", "QFont",
    "QGuiApplication", "QClipboard", "QCursor", "QMimeData", "QDrag", "QDropEvent", "QDragEnterEvent",
    "QDragMoveEvent", "QScreen", "QUrl",
    "QValidator", "QIntValidator", "QDoubleValidator", "QRegularExpressionValidator", "QRegularExpression", "QLocale",
    "cmath", "vector",
]

cpp_prelude = """
// Validate `text` with a validator: QValidator_Invalid, _Intermediate or _Acceptable.
static int qtf_validate(const QValidator *v, QString text) {
    int pos = 0;
    return int(v->validate(text, pos));
}

// A double validator using the C locale (a '.' decimal point, as Fortran reads numbers).
static QDoubleValidator *qtf_double_validator(double bottom, double top, int decimals, QObject *parent) {
    auto *v = new QDoubleValidator(bottom, top, decimals, parent);
    v->setLocale(QLocale::c());
    return v;
}

// Parse a color name ("red", "#ff8000", ...); returns 0 if invalid.
QTF_API int qtf_qcolor_fromString(const char *s, int len, int *r, int *g, int *b, int *a) {
    const QColor c = QColor::fromString(qtf_qstring(s, len));
    c.getRgb(r, g, b, a);
    return qtf_bool(c.isValid());
}

static QPen qtf_pen(const QColor &color, double width, int style) {
    QPen pen(color);
    pen.setWidthF(width);
    pen.setStyle(Qt::PenStyle(style));
    return pen;
}

// Colormaps: evenly spaced stops (sampled from matplotlib's maps), expanded to
// a 256-entry lookup table. Unknown names give viridis.
static std::vector<QRgb> qtf_colormap(const QString &name) {
    static const struct {
        const char *name;
        std::vector<QRgb> stops;
    } maps[] = {
        {"viridis", {0x440154, 0x482878, 0x3e4989, 0x31688e, 0x26828e, 0x1f9e89, 0x35b779, 0x6ece58, 0xb5de2b,
                     0xfde725}},
        {"magma", {0x000004, 0x180f3d, 0x440f76, 0x721f81, 0x9e2f7f, 0xcd4071, 0xf1605d, 0xfd9668, 0xfeca8d,
                   0xfcfdbf}},
        {"inferno", {0x000004, 0x1b0c41, 0x4a0c6b, 0x781c6d, 0xa52c60, 0xcf4446, 0xed6925, 0xfb9b06, 0xf7d13d,
                     0xfcffa4}},
        {"plasma", {0x0d0887, 0x46039f, 0x7201a8, 0x9c179e, 0xbd3786, 0xd8576b, 0xed7953, 0xfb9f3a, 0xfdca26,
                    0xf0f921}},
        {"coolwarm", {0x3b4cc0, 0x6788ee, 0x9abbff, 0xc9d7f0, 0xedd1c2, 0xf7a889, 0xe26952, 0xb40426}},
        {"gray", {0x000000, 0xffffff}},
    };
    const std::vector<QRgb> *stops = &maps[0].stops;
    for (const auto &m : maps)
        if (name.compare(QLatin1String(m.name), Qt::CaseInsensitive) == 0) stops = &m.stops;
    std::vector<QRgb> lut(256);
    const int n = int(stops->size());
    for (int k = 0; k < 256; ++k) {
        const double t = k / 255.0 * (n - 1);
        const int i = std::min(int(t), n - 2);
        const double f = t - i;
        const QRgb a = (*stops)[i], b = (*stops)[i + 1];
        lut[k] = qRgb(int(qRed(a) + f * (qRed(b) - qRed(a)) + 0.5), int(qGreen(a) + f * (qGreen(b) - qGreen(a)) + 0.5),
                      int(qBlue(a) + f * (qBlue(b) - qBlue(a)) + 0.5));
    }
    return lut;
}

// An nx x ny image of values v (v[i + j*nx], i.e. a Fortran array v(nx, ny))
// through a colormap; NaN is transparent. flip: row 0 shows the last j.
QTF_API void *qtf_qimage_fromArray(const double *v, int nx, int ny, double vmin, double vmax, const char *cmap,
                                   int len, int flip) {
    const std::vector<QRgb> lut = qtf_colormap(qtf_qstring(cmap, len));
    auto *img = new QImage(nx, ny, QImage::Format_ARGB32);
    const double span = vmax > vmin ? vmax - vmin : 1.0;
    for (int j = 0; j < ny; ++j) {
        auto *line = reinterpret_cast<QRgb *>(img->scanLine(flip ? ny - 1 - j : j));
        const double *row = v + static_cast<size_t>(j) * nx;
        for (int i = 0; i < nx; ++i) {
            if (std::isnan(row[i])) {
                line[i] = qRgba(0, 0, 0, 0);
                continue;
            }
            const double t = std::clamp((row[i] - vmin) / span, 0.0, 1.0);
            line[i] = lut[int(t * 255 + 0.5)];
        }
    }
    return img;
}

// A colormap gradient for legends (vertical: the maximum is at the top).
QTF_API void *qtf_qimage_colorbar(const char *cmap, int len, int width, int height, int vertical) {
    const std::vector<QRgb> lut = qtf_colormap(qtf_qstring(cmap, len));
    auto *img = new QImage(std::max(width, 1), std::max(height, 1), QImage::Format_ARGB32);
    for (int y = 0; y < img->height(); ++y) {
        auto *line = reinterpret_cast<QRgb *>(img->scanLine(y));
        for (int x = 0; x < img->width(); ++x) {
            const double t = vertical ? 1.0 - double(y) / std::max(img->height() - 1, 1)
                                      : double(x) / std::max(img->width() - 1, 1);
            line[x] = lut[int(t * 255 + 0.5)];
        }
    }
    return img;
}

// A font from the fields of a Fortran QFont, starting from the application font
// (an empty family or pointSize <= 0 keeps the default).
static QFont qtf_font(const QString &family, double pointSize, bool bold, bool italic) {
    QFont f = QGuiApplication::font();
    if (!family.isEmpty()) f.setFamily(family);
    if (pointSize > 0) f.setPointSizeF(pointSize);
    f.setBold(bold);
    f.setItalic(italic);
    return f;
}

// URLs from strings: "scheme://..." as given, anything else as a local file path.
static QList<QUrl> qtf_urls(const QStringList &items) {
    QList<QUrl> urls;
    for (const QString &s : items) urls << (s.contains(QLatin1String("://")) ? QUrl(s) : QUrl::fromLocalFile(s));
    return urls;
}

// URLs as strings: local files as paths, others as URLs.
static QStringList qtf_url_strings(const QList<QUrl> &urls) {
    QStringList out;
    for (const QUrl &u : urls) out << (u.isLocalFile() ? u.toLocalFile() : u.toString());
    return out;
}

// A synthetic drag-enter, drag-move or drop event.
static QDropEvent *qtf_drop_event(QEvent::Type type, double x, double y, QMimeData *mime, Qt::DropActions actions,
                                  Qt::MouseButtons buttons, Qt::KeyboardModifiers modifiers) {
    const QPoint p(qRound(x), qRound(y));
    switch (type) {
    case QEvent::DragEnter: return new QDragEnterEvent(p, actions, mime, buttons, modifiers);
    case QEvent::DragMove: return new QDragMoveEvent(p, actions, mime, buttons, modifiers);
    default: return new QDropEvent(QPointF(x, y), actions, mime, buttons, modifiers);
    }
}

// The mime data of a drag-and-drop event (never null).
static const QMimeData *qtf_mime(const QDropEvent *e) {
    static const QMimeData empty;
    return e->mimeData() ? e->mimeData() : &empty;
}

// Release a gradient (QGradient has no virtual destructor: delete the actual type).
static void qtf_delete_gradient(QGradient *g) {
    switch (g->type()) {
    case QGradient::LinearGradient: delete static_cast<QLinearGradient *>(g); break;
    case QGradient::RadialGradient: delete static_cast<QRadialGradient *>(g); break;
    case QGradient::ConicalGradient: delete static_cast<QConicalGradient *>(g); break;
    default: delete g; break;
    }
}

static QPolygonF qtf_polygon(const double *xs, const double *ys, int n) {
    QPolygonF poly;
    poly.reserve(n);
    for (int i = 0; i < n; ++i) poly << QPointF(xs[i], ys[i]);
    return poly;
}
