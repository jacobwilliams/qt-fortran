    "setBrush(brush: QBrush) -- Set the brush used to fill shapes.",
    { sig = "setBrushColor(color: QColor)", fortran_name = "setBrush", cpp = "{self}->setBrush({color})", doc = "Fill shapes with a solid `color`." },
    "setRenderHint(hint: QPainter::RenderHint, on: bool = .true.) -- Enable (default) or disable a QPainter_* render hint.",
    "setOpacity(opacity: double) -- Set the opacity (0 transparent .. 1 opaque).",
