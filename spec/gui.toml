# Bindings for Qt Gui. `pixi run gen` turns this into shim/qtf_gui.cpp and
# src/gui/qt_gui.f90 (see tools/gen_bindings.py for the format). The value
# types (QColor, QPen, QBrush, QFont) are hand-written in src/gui/qt_gui_types.f90.

module = "gui"
signal_base = 2000
doc = """
Qt Gui: painting, images, input events and actions.

The value types QColor, QPen, QBrush and QFont live in qt_gui_types.
Images, pixmaps and painters created from Fortran hold C++ objects and must be
released with `delete` / `end`.
"""
uses = [
    "use qt_c_util",
    "use qt_c_gui",
    "use qt_core",
    "use qt_gui_types",
    "use qt_geometry",
]
