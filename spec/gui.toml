A native window: a surface that something other than Qt's widgets draws
on, typically an external rendering engine with its own OpenGL context
(QOpenGLContext) or swap chain. Embed it among widgets with
QWidget_createWindowContainer, and receive its events with a QtfEventFilter
(expose, resize, mouse, keys). Sizes are in logical pixels: multiply by
`devicePixelRatio` for physical pixels."""
ctor = "(parent: QWindow?) -- Create a window (set its surface type before it is shown)."
signals = [
    "widthChanged: int -- The width changed.",
    "heightChanged: int -- The height changed.",
    "visibleChanged: bool -- The window was shown or hidden.",
    "activeChanged: void -- The window became active or inactive.",
]
methods = [
    "setSurfaceType(type: QSurface::SurfaceType) -- What renders the window: QSurface_OpenGLSurface, _RasterSurface, _VulkanSurface, ...",
    "surfaceType() -> QSurface::SurfaceType -- The surface type.",
    "create() -- Create the native window now (normally done when it is first shown).",
    "destroy() -- Destroy the native window (and its children's), releasing its native resources; it is made again when the window is next shown or created. A QtfEventFilter's `surfaceAboutToBeDestroyed` is emitted first.",
    "show() -- Show the window.",
    "hide() -- Hide the window.",
    "isVisible() -> bool -- True if the window is shown.",
    "isExposed() -> bool -- True while the window is visible on screen (render only then).",
