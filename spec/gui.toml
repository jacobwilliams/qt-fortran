[[class]]
name = "QImage"
handle = true
doc = "An image in memory (a C++ QImage); release it with `delete`."
ctors = [
    { sig = "(width: int, height: int)", name = "new", cpp = "new QImage({width}, {height}, QImage::Format_ARGB32_Premultiplied)", doc = "A new, uninitialized ARGB32 image; `fill` it before use." },
    { sig = "(fileName: string)", name = "fromFile", doc = "Load an image file; check `isNull()` for failure." },
]
methods = [
    "width() -> int -- Width in pixels.",
    "height() -> int -- Height in pixels.",
    "fill(color: QColor) -- Fill the whole image with `color`.",
    "setPixelColor(x: int, y: int, color: QColor) -- Set pixel (x, y), 0-based, to `color`.",
    "save(fileName: string) -> bool -- Save to a file; the format follows the extension (.png, .jpg, ...).",
]
cpp = '''
// Release an image.
QTF_API void qtf_qimage_delete(void *self) { delete as<QImage>(self); }

// True if the image has no data.
QTF_API int qtf_qimage_isNull(void *self) { return qtf_bool(as<QImage>(self)->isNull()); }

// The color of pixel (x, y) as RGBA components.
QTF_API void qtf_qimage_pixelColor(void *self, int x, int y, int *r, int *g, int *b, int *a) {
    as<QImage>(self)->pixelColor(x, y).getRgb(r, g, b, a);
}
'''
fortran_bindings = '''
procedure :: delete => qimage_delete
procedure :: isNull => qimage_isNull
procedure :: pixelColor => qimage_pixelColor
'''
fortran_procedures = '''
    !> An image of a 2D array through a colormap. Pixel (i-1, j-1) shows
    !> values(i, j): the first index runs along x, the second along y (downward
    !> as in an image; with `flipY` upward, as in a plot). Values from vmin to
    !> vmax (default: the data range, ignoring NaN) are mapped onto the colormap:
    !> 'viridis' (default), 'magma', 'inferno', 'plasma', 'gray' or 'coolwarm'.
    !> NaN is transparent. Delete the image when done.
    function QImage_fromArray(values, colormap, vmin, vmax, flipY) result(img)
        use, intrinsic :: ieee_arithmetic, only: ieee_is_nan
        real(c_double), intent(in) :: values(:, :)
        character(len=*), intent(in), optional :: colormap
        real(c_double), intent(in), optional :: vmin, vmax
        logical, intent(in), optional :: flipY
        type(QImage) :: img
        real(c_double) :: lo, hi
        character(len=:), allocatable :: cmap
        logical :: flip
        lo = 0.0_c_double
        hi = 1.0_c_double
        if (any(.not. ieee_is_nan(values))) then
            lo = minval(values, mask=.not. ieee_is_nan(values))
            hi = maxval(values, mask=.not. ieee_is_nan(values))
        end if
        if (present(vmin)) lo = vmin
        if (present(vmax)) hi = vmax
        cmap = 'viridis'
        if (present(colormap)) cmap = colormap
        flip = .false.
        if (present(flipY)) flip = flipY
        img%ptr = qtf_qimage_fromArray(values, int(size(values, 1), c_int), int(size(values, 2), c_int), &
                                       lo, hi, cmap, len(cmap, c_int), qtf_int(flip))
    end function QImage_fromArray

    !> A colormap gradient image for legends: vertical (default; the maximum at
    !> the top) or horizontal. Delete the image when done.
    function QImage_colorbar(colormap, width, height, vertical) result(img)
        character(len=*), intent(in) :: colormap
        integer, intent(in) :: width, height
        logical, intent(in), optional :: vertical
        type(QImage) :: img
        logical :: v
        v = .true.
        if (present(vertical)) v = vertical
        img%ptr = qtf_qimage_colorbar(colormap, len(colormap, c_int), int(width, c_int), int(height, c_int), &
                                      qtf_int(v))
    end function QImage_colorbar

    !> Release the image.
    subroutine qimage_delete(self)
        class(QImage), intent(inout) :: self
        if (c_associated(self%ptr)) call qtf_qimage_delete(self%ptr)
        self%ptr = c_null_ptr
    end subroutine qimage_delete

    !> True if there is no image data (e.g. after a failed load).
    logical function qimage_isNull(self)
        class(QImage), intent(in) :: self
        qimage_isNull = .true.
        if (c_associated(self%ptr)) qimage_isNull = qtf_logical(qtf_qimage_isNull(self%ptr))
    end function qimage_isNull

    !> The color of pixel (x, y), 0-based.
    function qimage_pixelColor(self, x, y) result(c)
        class(QImage), intent(in) :: self
        integer, intent(in) :: x, y
        type(QColor) :: c
        integer(c_int) :: r, g, b, a
        call qtf_qimage_pixelColor(self%ptr, int(x, c_int), int(y, c_int), r, g, b, a)
        c = QColor(r, g, b, a)
    end function qimage_pixelColor
'''

