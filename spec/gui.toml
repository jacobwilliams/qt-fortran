QTF_API void qtf_qtransform_delete(void *self) { delete as<QTransform>(self); }
"""
fortran_bindings = "procedure :: delete => qtransform_delete"
fortran_procedures = """
    !> Release the transform.
    subroutine qtransform_delete(self)
        class(QTransform), intent(inout) :: self
        if (c_associated(self%ptr)) call qtf_qtransform_delete(self%ptr)
        self%ptr = c_null_ptr
    end subroutine qtransform_delete
"""

[[class]]
name = "QFontMetrics"
handle = true
doc = """
Text measurements for a font, in pixels: `QFontMetrics()` for the
application font, `QFontMetrics(font)` for a QFont, or QPainter%fontMetrics
for the painter's. Release it with `delete`."""
ctor = "() -- Metrics of the application's default font."
cpp_ctor = "new QFontMetrics(QGuiApplication::font())"
methods = [
    "horizontalAdvance(text: string) -> int -- Width of `text` (the advance to where the next text would start).",
    { sig = "boundingWidth(text: string) -> int", cpp = "{self}->boundingRect({text}).width()", doc = "Width of the ink of `text` (its bounding rectangle)." },
    "boundingRect(text: string) -> QRect -- The rectangle covered by the ink of `text`, relative to its baseline origin (so `y` is negative).",
    { sig = "size(flags: int, text: string) -> QSize", doc = "The size of `text` laid out with `flags` (e.g. 0, or Qt_TextSingleLine)." },
    "height() -> int -- Line height (ascent + descent).",
    "ascent() -> int -- Distance from the baseline to the top of the tallest glyphs.",
    "descent() -> int -- Distance from the baseline to the bottom of the lowest glyphs.",
    "leading() -> int -- Extra space between lines.",
    "lineSpacing() -> int -- Distance from one baseline to the next.",
    "averageCharWidth() -> int -- Average character width.",
    "maxWidth() -> int -- Width of the widest character.",
    "capHeight() -> int -- Height of capital letters.",
    "xHeight() -> int -- Height of lowercase letters (without ascenders).",
    { sig = "elidedText(text: string, mode: Qt::TextElideMode, width: int) -> string", doc = "`text` shortened with an ellipsis (Qt_ElideRight, _ElideLeft, _ElideMiddle) to fit `width` pixels." },
]
cpp = """
// Release font metrics.
QTF_API void qtf_qfontmetrics_delete(void *self) { delete as<QFontMetrics>(self); }

// Metrics of a font given by the fields of a Fortran QFont.
QTF_API void *qtf_qfontmetrics_fromFont(const char *family, int len, double pointSize, int bold, int italic) {
    return new QFontMetrics(qtf_font(qtf_qstring(family, len), pointSize, bold != 0, italic != 0));
}
"""
fortran_bindings = "procedure :: delete => qfontmetrics_delete"
fortran_procedures = """
    !> Release the metrics.
    subroutine qfontmetrics_delete(self)
        class(QFontMetrics), intent(inout) :: self
        if (c_associated(self%ptr)) call qtf_qfontmetrics_delete(self%ptr)
        self%ptr = c_null_ptr
    end subroutine qfontmetrics_delete

    !> Metrics of `font` (unset fields take the application font's values).
    function qfontmetrics_fromFont(font) result(res)
        type(QFont), intent(in) :: font
        type(QFontMetrics) :: res
        if (allocated(font%family)) then
            res%ptr = qtf_qfontmetrics_fromFont(font%family, len(font%family, c_int), font%pointSize, &
                                                qtf_int(font%bold), qtf_int(font%italic))
        else
            res%ptr = qtf_qfontmetrics_fromFont('', 0_c_int, font%pointSize, qtf_int(font%bold), &
                                                qtf_int(font%italic))
        end if
    end function qfontmetrics_fromFont
"""

