    { sig = "availableY() -> int", cpp = "{self}->availableGeometry().y()", doc = "Top of the available area." },
    { sig = "availableWidth() -> int", cpp = "{self}->availableGeometry().width()", doc = "Width of the available area." },
    { sig = "availableHeight() -> int", cpp = "{self}->availableGeometry().height()", doc = "Height of the available area." },
    "geometry() -> QRect -- The screen's position and size in the virtual desktop (logical pixels).",
    "availableGeometry() -> QRect -- The area available to windows (without docks and task bars).",
    "size() -> QSize -- The size in logical pixels.",
    "physicalSize() -> QSizeF -- The physical size in millimeters (0 x 0 if unknown).",
    "devicePixelRatio() -> double -- Physical pixels per logical pixel (2 on a typical HiDPI display).",
