    "text() -> string -- The action's text.",
    { sig = "setShortcut(shortcut: string)", cpp = "{self}->setShortcut(QKeySequence({shortcut}))", doc = "Set the keyboard shortcut, e.g. 'Ctrl+O' (Ctrl is Cmd on macOS)." },
    { sig = "shortcut() -> string", cpp = "{self}->shortcut().toString(QKeySequence::PortableText)", doc = "The shortcut in portable text form, e.g. 'Ctrl+O'." },
    "setCheckable(checkable: bool) -- Make the action a toggle (or a plain command).",
