    { sig = "setImage(image: QImage, mode: QClipboard::Mode = QClipboard_Clipboard)", cpp = "{self}->setImage(*{image}, {mode})", doc = "Put an image on the clipboard (copied)." },
    { sig = "image(mode: QClipboard::Mode = QClipboard_Clipboard) -> QImage", cpp = "new QImage({self}->image({mode}))", doc = "The clipboard's image (null if none; delete it when done)." },
    { sig = "hasImage(mode: QClipboard::Mode = QClipboard_Clipboard) -> bool", cpp = "{self}->mimeData({mode}) && {self}->mimeData({mode})->hasImage()", doc = "True if the clipboard holds an image." },
    "setMimeData(data: QMimeData, mode: QClipboard::Mode = QClipboard_Clipboard) -- Put mime data on the clipboard (it takes ownership).",
    { sig = "mimeData(mode: QClipboard::Mode = QClipboard_Clipboard) -> QMimeData", cpp = "const_cast<QMimeData *>({self}->mimeData({mode}))", doc = "The clipboard's data (owned by the clipboard; valid until it changes)." },
    "clear(mode: QClipboard::Mode = QClipboard_Clipboard) -- Empty the clipboard.",
