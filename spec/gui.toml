    "setNotation(notation: QDoubleValidator::Notation) -- QDoubleValidator_StandardNotation or _ScientificNotation (default).",
    "bottom() -> double -- The smallest accepted value.",
    "top() -> double -- The largest accepted value.",
    "decimals() -> int -- The maximum number of decimals.",
]

