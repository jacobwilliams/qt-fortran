[[class]]
name = "QPainter"
handle = true
doc = """
Draws on an image, or on a QtfWidget inside its paintEvent slot.
Coordinates may be integers or `real(c_double)`."""
fortran_components = "logical :: owned = .false.   !! created from Fortran: `end` deletes it"
ctor = "(image: QImage) -- Begin painting on `image`; call `end` when done."
