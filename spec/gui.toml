    "width() -> int -- Width in logical pixels.",
    "height() -> int -- Height in logical pixels.",
    { sig = "resizeSize(size: QSize)", fortran_name = "resize", cpp = "{self}->resize({size})", doc = "Resize, in logical pixels." },
    "size() -> QSize -- The size in logical pixels.",
    "position() -> QPoint -- The position of the window (on the screen for a top-level window).",
    "setPosition(position: QPoint) -- Move the window.",
    "geometry() -> QRect -- The window's position and size (without the frame).",
    "setGeometry(rect: QRect) -- Set the window's position and size (without the frame).",
    "mapToGlobal(p: QPoint) -> QPoint -- A point in window coordinates as screen coordinates.",
    "mapFromGlobal(p: QPoint) -> QPoint -- A point in screen coordinates as window coordinates.",
    "devicePixelRatio() -> double -- Physical pixels per logical pixel (2 on a typical HiDPI display).",
    "winId() -> int64 -- The native window handle (an NSView* on macOS, an HWND on Windows, an X11/xcb window id on Linux), for rendering engines that draw into the window themselves (e.g. Vulkan). Creates the native window if needed.",
    "setTitle(title: string) -- The window title (for a top-level window).",
    "title() -> string -- The window title.",
    "screen() -> QScreen -- The screen the window is on.",
    "requestUpdate() -- Ask for an UpdateRequest event (a QtfEventFilter's `updateRequest`) at the next frame, for render loops on the GUI thread.",
]
