    "restore() -- Pop the painter state saved by `save`.",
    "translate(dx: num, dy: num) -- Move the coordinate origin by (dx, dy).",
    "scale(sx: double, sy: double) -- Scale the coordinate system by (sx, sy).",
    "rotate(degrees: double) -- Rotate the coordinate system clockwise by `degrees`.",
    "resetTransform() -- Reset the coordinate transform to the identity.",
    { sig = "drawPoint(x: num, y: num)", cpp = "{self}->drawPoint(QPointF({x}, {y}))", doc = "Draw a point with the pen." },
    { sig = "drawLine(x1: num, y1: num, x2: num, y2: num)", cpp = "{self}->drawLine(QPointF({x1}, {y1}), QPointF({x2}, {y2}))", doc = "Draw a line from (x1, y1) to (x2, y2)." },
    { sig = "drawRect(x: num, y: num, w: num, h: num)", cpp = "{self}->drawRect(QRectF({x}, {y}, {w}, {h}))", doc = "Draw a rectangle: outlined with the pen, filled with the brush." },
    { sig = "drawRoundedRect(x: num, y: num, w: num, h: num, rx: num, ry: num)", cpp = "{self}->drawRoundedRect(QRectF({x}, {y}, {w}, {h}), {rx}, {ry})", doc = "Draw a rectangle with corners rounded by radii (rx, ry)." },
    { sig = "drawEllipse(x: num, y: num, w: num, h: num)", cpp = "{self}->drawEllipse(QRectF({x}, {y}, {w}, {h}))", doc = "Draw the ellipse inscribed in the rectangle (x, y, w, h)." },
    { sig = "fillRect(x: num, y: num, w: num, h: num, color: QColor)", cpp = "{self}->fillRect(QRectF({x}, {y}, {w}, {h}), {color})", doc = "Fill a rectangle with `color` (ignores pen and brush)." },
    { sig = "drawPolyline(x: num[], y: num[])", cpp = "{self}->drawPolyline(qtf_polygon({x}, {y}, {n}))", doc = "Draw connected line segments through the points (x(i), y(i))." },
    { sig = "drawPolygon(x: num[], y: num[])", cpp = "{self}->drawPolygon(qtf_polygon({x}, {y}, {n}))", doc = "Draw a closed polygon through the points (x(i), y(i)), filled with the brush." },
    { sig = "drawText(x: num, y: num, text: string)", cpp = "{self}->drawText(QPointF({x}, {y}), {text})", doc = "Draw text with its baseline starting at (x, y)." },
    { sig = "drawTextRect(x: num, y: num, w: num, h: num, flags: int, text: string)", fortran_name = "drawText", cpp = "{self}->drawText(QRectF({x}, {y}, {w}, {h}), {flags}, {text})", doc = "Draw text inside a rectangle, aligned by `flags` (e.g. Qt_AlignCenter)." },
    { sig = "drawImage(x: int, y: int, image: QImage)", cpp = "{self}->drawImage(QPointF({x}, {y}), *{image})", doc = "Draw `image` with its top-left corner at (x, y)." },
    { sig = "drawImageRect(x: num, y: num, w: num, h: num, image: QImage)", fortran_name = "drawImage", cpp = "{self}->drawImage(QRectF({x}, {y}, {w}, {h}), *{image})", doc = "Draw `image` scaled into the rectangle (x, y, w, h); smooth with the QPainter_SmoothPixmapTransform hint." },
    { sig = "textWidth(text: string) -> int", cpp = "{self}->fontMetrics().horizontalAdvance({text})", doc = "Width in pixels of `text` in the current font." },
    { sig = "fontHeight() -> int", cpp = "{self}->fontMetrics().height()", doc = "Line height in pixels of the current font." },
