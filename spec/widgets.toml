ctor = "(parent: QWidget?) -- Create an empty combo box."
signals = [
    "currentIndexChanged: int -- The current item changed (0-based index; -1 if none).",
    "currentTextChanged: string -- The current text changed.",
    "activated: int -- The user chose an item (0-based index).",
]
methods = [
    "addItem(text: string) -- Append an item.",
    "insertItem(index: int, text: string) -- Insert an item before position `index` (0-based).",
    "removeItem(index: int) -- Remove the item at `index` (0-based).",
    "clear() -- Remove all items.",
    "count() -> int -- Number of items.",
    "currentIndex() -> int -- Index of the current item (0-based; -1 if none).",
    "setCurrentIndex(index: int) -- Select the item at `index` (0-based).",
    "currentText() -> string -- Text of the current item.",
    "setCurrentText(text: string) -- Select the item with this text (or set the text, if editable).",
    "itemText(index: int) -> string -- Text of the item at `index` (0-based).",
    "findText(text: string) -> int -- Index of the item with this text (0-based; -1 if not found).",
    "setEditable(editable: bool) -- Allow typing a value that is not in the list.",
]
fortran_bindings = "procedure :: addItems => qcombobox_addItems"
fortran_procedures = """
    !> Add several items; trailing blanks of each element are trimmed.
    subroutine qcombobox_addItems(self, texts)
        class(QComboBox), intent(in) :: self
        character(len=*), intent(in) :: texts(:)
        integer :: i
        do i = 1, size(texts)
            call self%addItem(trim(texts(i)))
        end do
    end subroutine qcombobox_addItems
"""

