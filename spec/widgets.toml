name = "QInputDialog"
base = "QDialog"
doc = "Simple modal dialogs that ask for one value (use the static functions)."
methods = [
    { sig = "static getText(title: string, label: string, text: string = '', ok: bool&, parent: QWidget?) -> string", cpp = "QInputDialog::getText({parent}, {title}, {label}, QLineEdit::Normal, {text}, {ok})", doc = "Ask for a line of text; `ok` is false if cancelled." },
    { sig = "static getMultiLineText(title: string, label: string, text: string = '', ok: bool&, parent: QWidget?) -> string", cpp = "QInputDialog::getMultiLineText({parent}, {title}, {label}, {text}, {ok})", doc = "Ask for multi-line text; `ok` is false if cancelled." },
    { sig = "static getInt(title: string, label: string, value: int = 0, minimum: int = -2147483647, maximum: int = 2147483647, step: int = 1, ok: bool&, parent: QWidget?) -> int", cpp = "QInputDialog::getInt({parent}, {title}, {label}, {value}, {minimum}, {maximum}, {step}, {ok})", doc = "Ask for an integer; `ok` is false if cancelled." },
    { sig = "static getDouble(title: string, label: string, value: double = 0.0_c_double, minimum: double = -2147483647.0_c_double, maximum: double = 2147483647.0_c_double, decimals: int = 2, ok: bool&, parent: QWidget?) -> double", cpp = "QInputDialog::getDouble({parent}, {title}, {label}, {value}, {minimum}, {maximum}, {decimals}, {ok})", doc = "Ask for a real number; `ok` is false if cancelled." },
    { sig = "static getItem(title: string, label: string, items: strings, current: int = 0, editable: bool = .true., ok: bool&, parent: QWidget?) -> string", cpp = "QInputDialog::getItem({parent}, {title}, {label}, {items}, {current}, {editable}, {ok})", doc = "Ask to choose one of `items` (0-based `current` preselected); `ok` is false if cancelled." },
