    { sig = "activated: custom", fortran_type = "QSignalInt2", lambda = "const QModelIndex &i", emit = "qtf_emit_ints(ref, {i.row(), i.column()})", doc = "A cell was activated (double-click or Enter): (row, column)." },
]
methods = [
