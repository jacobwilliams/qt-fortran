[[class]]
name = "QtfWidget"
base = "QWidget"
doc = """
A widget whose event handlers are delivered to Fortran slots, the
qt-fortran counterpart of subclassing QWidget and overriding paintEvent,
mousePressEvent, ... (`Qtf` marks it as a qt-fortran class, not a Qt one).

Paint slots receive a painter already active on the widget; do not `end`
it. Events with no connected slot get Qt's default handling. The widget
accepts keyboard focus (Qt_StrongFocus); mouse moves without a pressed
button arrive only after `setMouseTracking(.true.)`."""
ctor = "(parent: QWidget?) -- Create a QtfWidget; without a parent it is a top-level window."
signals = [
    { sig = "paintEvent: painter", doc = "Paint request.", connector = "connect_event<QTF_EV_PAINT>" },
    { sig = "mousePressEvent: mouse", doc = "Mouse button pressed.", connector = "connect_event<QTF_EV_MOUSEPRESS>" },
    { sig = "mouseReleaseEvent: mouse", doc = "Mouse button released.", connector = "connect_event<QTF_EV_MOUSERELEASE>" },
    { sig = "mouseMoveEvent: mouse", doc = "Mouse moved.", connector = "connect_event<QTF_EV_MOUSEMOVE>" },
    { sig = "mouseDoubleClickEvent: mouse", doc = "Mouse button double-clicked.", connector = "connect_event<QTF_EV_MOUSEDOUBLECLICK>" },
    { sig = "wheelEvent: wheel", doc = "Wheel turned.", connector = "connect_event<QTF_EV_WHEEL>" },
    { sig = "keyPressEvent: key", doc = "Key pressed.", connector = "connect_event<QTF_EV_KEYPRESS>" },
    { sig = "keyReleaseEvent: key", doc = "Key released.", connector = "connect_event<QTF_EV_KEYRELEASE>" },
    { sig = "resizeEvent: resize", doc = "Widget resized.", connector = "connect_event<QTF_EV_RESIZE>" },
]

