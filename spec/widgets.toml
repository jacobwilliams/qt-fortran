[[class]]
name = "QFileDialog"
base = "QDialog"
doc = "A dialog to choose files or directories."
ctor = "(caption: string = '', directory: string = '', filter: string = '', parent: QWidget?) -- A file dialog (configure, then `exec`)."
cpp_ctor = "new QFileDialog({parent}, {caption}, {directory}, {filter})"
methods = [
    "setFileMode(mode: QFileDialog::FileMode) -- What may be selected (QFileDialog_AnyFile, _ExistingFile, _Directory, _ExistingFiles).",
    "setAcceptMode(mode: QFileDialog::AcceptMode) -- Open (QFileDialog_AcceptOpen) or save (QFileDialog_AcceptSave) mode.",
    "setOption(option: QFileDialog::Option, on: bool = .true.) -- Enable (default) or disable a QFileDialog_* option.",
    "setNameFilter(filter: string) -- Set the file name filter, e.g. 'Images (*.png *.jpg)'.",
    "setDirectory(directory: string) -- Set the directory shown.",
    "setDefaultSuffix(suffix: string) -- Suffix added to file names typed without one (e.g. 'png').",
    "selectFile(filename: string) -- Preselect a file name (relative to the directory, or absolute).",
    "selectedFiles() -> strings -- The selected files (absolute paths); `files(i)%s` is the i-th name.",
    { sig = "static getOpenFileName(caption: string = '', dir: string = '', filter: string = '', parent: QWidget?, options: QFileDialog::Options = 0) -> string", cpp = "QFileDialog::getOpenFileName({parent}, {caption}, {dir}, {filter}, nullptr, {options})", doc = "Modal \"open file\" dialog; returns the chosen path, or '' if cancelled." },
    { sig = "static getOpenFileNames(caption: string = '', dir: string = '', filter: string = '', parent: QWidget?, options: QFileDialog::Options = 0) -> strings", cpp = "QFileDialog::getOpenFileNames({parent}, {caption}, {dir}, {filter}, nullptr, {options})", doc = "Modal \"open files\" dialog; returns the chosen paths (empty if cancelled)." },
    { sig = "static getSaveFileName(caption: string = '', dir: string = '', filter: string = '', parent: QWidget?, options: QFileDialog::Options = 0) -> string", cpp = "QFileDialog::getSaveFileName({parent}, {caption}, {dir}, {filter}, nullptr, {options})", doc = "Modal \"save file\" dialog; returns the chosen path, or '' if cancelled." },
    { sig = "static getExistingDirectory(caption: string = '', dir: string = '', parent: QWidget?, options: QFileDialog::Options = QFileDialog_ShowDirsOnly) -> string", cpp = "QFileDialog::getExistingDirectory({parent}, {caption}, {dir}, {options})", doc = "Modal directory chooser; returns the chosen directory, or '' if cancelled." },
