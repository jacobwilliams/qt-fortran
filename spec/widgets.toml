# undo / redo

[[class]]
name = "QUndoStack"
doc = """
Undo and redo. A command is a text (shown as "Undo <text>") and an integer id
of your choosing: `push(text, id)` records it and immediately calls the
`redoRequested(id)` slots, which must perform it; undoing calls the
`undoRequested(id)` slots, which must reverse it. Keep what each id needs
(e.g. old and new values) in your own arrays. Menu actions that follow the
stack: `createUndoAction` / `createRedoAction`."""
ctor = "(parent: QObject?) -- An empty undo stack."
cpp_ctor = "new QtfUndoStack({parent})"
signals = [
    { sig = "redoRequested: int", connector = "connect_undo<false>", doc = "Perform (or redo) the command with this id (also called by `push`)." },
    { sig = "undoRequested: int", connector = "connect_undo<true>", doc = "Reverse the command with this id." },
    "canUndoChanged: bool -- Whether undo is possible changed.",
    "canRedoChanged: bool -- Whether redo is possible changed.",
    "indexChanged: int -- The current position in the stack changed.",
    "cleanChanged: bool -- The stack became clean (saved state) or not.",
    "undoTextChanged: string -- The text of the command `undo` would reverse changed.",
    "redoTextChanged: string -- The text of the command `redo` would perform changed.",
]
methods = [
    { sig = "push(text: string, id: int)", cpp = "qtf_undo_push({self}, {text}, {id})", doc = "Record a command and perform it (calls the redoRequested slots with `id`); discards commands that were undone." },
    "undo() -- Undo the last command.",
    "redo() -- Redo the last undone command.",
    "canUndo() -> bool -- True if there is a command to undo.",
    "canRedo() -> bool -- True if there is a command to redo.",
    "undoText() -> string -- The text of the command `undo` would reverse.",
    "redoText() -> string -- The text of the command `redo` would perform.",
    "count() -> int -- The number of commands.",
    "index() -> int -- The current position: commands before it are done.",
    "setIndex(index: int) -- Undo or redo until the position is `index`.",
    "text(index: int) -> string -- The text of the command at a position.",
    "clear() -- Remove all commands (nothing is undone).",
    "setClean() -- Mark the current state as saved.",
    "isClean() -> bool -- True if the current state is the saved one.",
    "setUndoLimit(limit: int) -- Keep at most `limit` commands (0: no limit); only while the stack is empty.",
    "beginMacro(text: string) -- Group the following pushes into one command (until endMacro).",
    "endMacro() -- End a macro.",
    "createUndoAction(parent: QObject, prefix: string = '') -> QAction -- An Undo action that follows the stack (text and enabled state).",
    "createRedoAction(parent: QObject, prefix: string = '') -> QAction -- A Redo action that follows the stack.",
]

