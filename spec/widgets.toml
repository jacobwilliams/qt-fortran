cpp_prelude = """
// QApplication keeps references to argc/argv, so they must outlive it.
static int qtf_argc = 0;
static std::vector<std::string> qtf_arg_strings;
static std::vector<char *> qtf_argv;

// Create the application with the program's command-line arguments (n items
// of `itemlen` bytes, blank padded; the first is the program name), or return
// the existing one.
QTF_API void *qtf_qapplication_new_args(const char *s, int itemlen, int n) {
    if (QApplication::instance()) return QApplication::instance();
    qtf_arg_strings.clear();
    for (const QString &a : qtf_qstringlist(s, itemlen, n)) qtf_arg_strings.push_back(a.toStdString());
    if (qtf_arg_strings.empty()) qtf_arg_strings.push_back("qt-fortran");
    qtf_argv.clear();
    for (std::string &a : qtf_arg_strings) qtf_argv.push_back(a.data());
    qtf_argv.push_back(nullptr);
    qtf_argc = static_cast<int>(qtf_arg_strings.size());
    return new QApplication(qtf_argc, qtf_argv.data());
}

// One of the style's standard icons by enum name (e.g. "SP_MediaPlay"); a null
// icon if the name is unknown.
static QIcon *qtf_standard_icon(const QString &name) {
    const QMetaEnum e = QMetaEnum::fromType<QStyle::StandardPixmap>();
    bool ok = false;
    const int v = e.keyToValue(name.toLatin1().constData(), &ok);
    return new QIcon(ok ? QApplication::style()->standardIcon(QStyle::StandardPixmap(v)) : QIcon());
}

// QtfWidget: a QWidget whose event handlers (virtual functions) are forwarded
// to Fortran slots. An event with no connected slot gets Qt's default handling.

enum qtf_widget_event {
    QTF_EV_PAINT,
    QTF_EV_MOUSEPRESS,
    QTF_EV_MOUSERELEASE,
    QTF_EV_MOUSEMOVE,
    QTF_EV_MOUSEDOUBLECLICK,
    QTF_EV_WHEEL,
    QTF_EV_KEYPRESS,
    QTF_EV_KEYRELEASE,
    QTF_EV_RESIZE,
    QTF_EV_COUNT
};

class QtfWidget : public QWidget {
  public:
    explicit QtfWidget(QWidget *parent) : QWidget(parent) { setFocusPolicy(Qt::StrongFocus); }

    // (not named `slots`: that is a Qt macro)
    std::array<std::vector<qtf_slot>, QTF_EV_COUNT> handlers;

  protected:
    // Emit to a copy: a slot may connect more slots while we iterate.
    bool forward(qtf_widget_event ev, void *p) {
        const std::vector<qtf_slot> targets = handlers[ev];
        for (const qtf_slot &s : targets) qtf_emit_ptr(s, p);
        return !targets.empty();
    }

    void paintEvent(QPaintEvent *e) override {
        if (handlers[QTF_EV_PAINT].empty()) return QWidget::paintEvent(e);
        QPainter painter(this);
        forward(QTF_EV_PAINT, &painter);
    }
    void mousePressEvent(QMouseEvent *e) override {
        if (!forward(QTF_EV_MOUSEPRESS, e)) QWidget::mousePressEvent(e);
    }
    void mouseReleaseEvent(QMouseEvent *e) override {
        if (!forward(QTF_EV_MOUSERELEASE, e)) QWidget::mouseReleaseEvent(e);
    }
    void mouseMoveEvent(QMouseEvent *e) override {
        if (!forward(QTF_EV_MOUSEMOVE, e)) QWidget::mouseMoveEvent(e);
    }
    void mouseDoubleClickEvent(QMouseEvent *e) override {
        if (!forward(QTF_EV_MOUSEDOUBLECLICK, e)) QWidget::mouseDoubleClickEvent(e);
    }
    void wheelEvent(QWheelEvent *e) override {
        if (!forward(QTF_EV_WHEEL, e)) QWidget::wheelEvent(e);
    }
    void keyPressEvent(QKeyEvent *e) override {
        if (!forward(QTF_EV_KEYPRESS, e)) QWidget::keyPressEvent(e);
    }
    void keyReleaseEvent(QKeyEvent *e) override {
        if (!forward(QTF_EV_KEYRELEASE, e)) QWidget::keyReleaseEvent(e);
    }
    void resizeEvent(QResizeEvent *e) override {
        QWidget::resizeEvent(e);
        forward(QTF_EV_RESIZE, e);
    }
};

// The value a Fortran data slot produces for one table cell.
struct QtfModelRequest {
    QVariant value;
};

// QtfTableModel: a table model whose cells are provided by Fortran slots on
// demand (dataRequested), so large Fortran arrays can be shown without copying
// them into Qt. Edits are reported to dataEdited slots.
class QtfTableModel : public QAbstractTableModel {
  public:
    QtfTableModel(int rows, int cols, QObject *parent) : QAbstractTableModel(parent), nrows(rows), ncols(cols) {}

    int nrows, ncols;
    bool editable = false;
    QStringList hlabels, vlabels;
    std::vector<qtf_slot> data_handlers, edit_handlers;

    int rowCount(const QModelIndex &parent) const override { return parent.isValid() ? 0 : nrows; }
    int columnCount(const QModelIndex &parent) const override { return parent.isValid() ? 0 : ncols; }

    QVariant data(const QModelIndex &i, int role) const override {
        if (!i.isValid() || (role != Qt::DisplayRole && role != Qt::EditRole)) return QVariant();
        QtfModelRequest req;
        const std::vector<qtf_slot> targets = data_handlers;   // a slot may connect more
        for (const qtf_slot &s : targets) qtf_emit_ptr_ints(s, &req, {i.row(), i.column()});
        return req.value;
    }

    bool setData(const QModelIndex &i, const QVariant &v, int role) override {
        if (!i.isValid() || role != Qt::EditRole || edit_handlers.empty()) return false;
        const std::vector<qtf_slot> targets = edit_handlers;
        for (const qtf_slot &s : targets) qtf_emit_ints_string(s, {i.row(), i.column()}, v.toString());
        emit dataChanged(i, i);
        return true;
    }

    Qt::ItemFlags flags(const QModelIndex &i) const override {
        Qt::ItemFlags f = QAbstractTableModel::flags(i);
        if (editable && i.isValid()) f |= Qt::ItemIsEditable;
        return f;
    }

    QVariant headerData(int section, Qt::Orientation o, int role) const override {
        const QStringList &labels = o == Qt::Horizontal ? hlabels : vlabels;
        if (role == Qt::DisplayRole && section < labels.size()) return labels[section];
        return QAbstractTableModel::headerData(section, o, role);
    }

    void setShape(int rows, int cols) {
        beginResetModel();
        nrows = rows;
        ncols = cols;
        endResetModel();
    }

    void setHeaders(Qt::Orientation o, const QStringList &labels) {
        (o == Qt::Horizontal ? hlabels : vlabels) = labels;
        const int n = o == Qt::Horizontal ? ncols : nrows;
        if (n > 0) emit headerDataChanged(o, 0, n - 1);
    }

    void refresh() {
        if (nrows > 0 && ncols > 0) emit dataChanged(index(0, 0), index(nrows - 1, ncols - 1));
    }

    void refreshCell(int r, int c) { emit dataChanged(index(r, c), index(r, c)); }
};

// Attach a slot to a QtfTableModel's data (WHICH = 0) or edit (WHICH = 1) requests.
template <int WHICH> static bool connect_model(void *s, const qtf_slot &ref) {
    auto *m = dynamic_cast<QtfTableModel *>(static_cast<QObject *>(s));
    if (!m) return false;
    (WHICH == 0 ? m->data_handlers : m->edit_handlers).push_back(ref);
    return true;
}

// Attach a slot to one of the QtfWidget's event handlers. The slots are owned
// by the widget, so they are released when it is destroyed.
template <qtf_widget_event EV> static bool connect_event(void *s, const qtf_slot &ref) {
    auto *w = dynamic_cast<QtfWidget *>(static_cast<QWidget *>(s));
    if (!w) return false;
    w->handlers[EV].push_back(ref);
    return true;
}
"""

fortran_decls = '''
