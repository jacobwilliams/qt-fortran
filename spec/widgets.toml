[[class]]
name = "QFontDialog"
base = "QDialog"
doc = "A font chooser (use QFontDialog_getFont)."
cpp = '''
// Font chooser: the initial font in, the chosen font out (its family is returned).
QTF_API char *qtf_qfontdialog_getFont(void *parent, const char *family, int flen, double pointSize, int bold,
                                      int italic, const char *title, int tlen, int *ok, double *size,
                                      int *outBold, int *outItalic, int *len) {
    QFont f;
    if (flen > 0) f.setFamily(qtf_qstring(family, flen));
    if (pointSize > 0) f.setPointSizeF(pointSize);
    f.setBold(bold != 0);
    f.setItalic(italic != 0);
    bool accepted = false;
    const QFont r = QFontDialog::getFont(&accepted, f, as<QWidget>(parent), qtf_qstring(title, tlen));
    *ok = accepted ? 1 : 0;
    *size = r.pointSizeF();
    *outBold = r.bold() ? 1 : 0;
    *outItalic = r.italic() ? 1 : 0;
    return qtf_to_c(r.family(), len);
}
'''

[[class]]
name = "QProgressDialog"
base = "QDialog"
doc = """
A dialog showing the progress of a long operation, with a cancel button. It
appears only if the operation takes longer than `setMinimumDuration` (4 s by
default). Keep the UI responsive with QApplication_processEvents while working."""
ctor = "(labelText: string = '', cancelButtonText: string = 'Cancel', minimum: int = 0, maximum: int = 100, parent: QWidget?) -- A progress dialog for the range minimum..maximum."
cpp_ctor = "new QProgressDialog({labelText}, {cancelButtonText}, {minimum}, {maximum}, {parent})"
signals = ["canceled: void -- The cancel button was clicked."]
methods = [
    "setValue(progress: int) -- Set the progress (at maximum, the dialog closes if auto-close is on).",
    "value() -> int -- The progress.",
    "setRange(minimum: int, maximum: int) -- Set the range.",
    "setLabelText(text: string) -- Set the message.",
    "wasCanceled() -> bool -- True if the user cancelled.",
    "setMinimumDuration(ms: int) -- Show the dialog only if the operation takes longer than this.",
    "reset() -- Reset (hides the dialog if auto-close is on).",
    "cancel() -- Cancel, as if the button were clicked.",
    "setAutoClose(close: bool) -- Hide when the value reaches the maximum (default).",
    "setAutoReset(reset: bool) -- Reset when the value reaches the maximum (default).",
]

