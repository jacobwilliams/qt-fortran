[[class]]
name = "QtfTableModel"
doc = """
A table model whose cells come from Fortran on demand (`Qtf` marks a
qt-fortran class): connect a slot to `dataRequested` and fill in each cell it
is asked for. Only visible cells are requested, so a QTableView can show large
Fortran arrays without copying them into Qt. Call `refresh` after the data
changes. Rows and columns are 0-based."""
ctor = "(rows: int = 0, columns: int = 0, parent: QObject?) -- A table model of the given shape."
cpp_ctor = "new QtfTableModel({rows}, {columns}, {parent})"
signals = [
    { sig = "dataRequested: custom", fortran_type = "QSignalModelData", connector = "connect_model<0>", doc = "A cell is needed: slots get (row, column, request) and set the request's value." },
    { sig = "dataEdited: custom", fortran_type = "QSignalModelEdit", connector = "connect_model<1>", doc = "The user edited a cell: slots get (row, column, text); store the new value." },
]
methods = [
    { sig = "setRowCount(rows: int)", cpp = "{self}->setShape({rows}, {self}->ncols)", doc = "Set the number of rows." },
    { sig = "setColumnCount(columns: int)", cpp = "{self}->setShape({self}->nrows, {columns})", doc = "Set the number of columns." },
    { sig = "rowCount() -> int", cpp = "{self}->nrows", doc = "Number of rows." },
    { sig = "columnCount() -> int", cpp = "{self}->ncols", doc = "Number of columns." },
    { sig = "setHorizontalHeaderLabels(labels: strings)", cpp = "{self}->setHeaders(Qt::Horizontal, {labels})", doc = "Set the column titles." },
    { sig = "setVerticalHeaderLabels(labels: strings)", cpp = "{self}->setHeaders(Qt::Vertical, {labels})", doc = "Set the row titles." },
    { sig = "setEditable(editable: bool)", cpp = "{self}->editable = {editable}", doc = "Allow editing cells (edits arrive at `dataEdited`)." },
    { sig = "refresh()", cpp = "{self}->refresh()", doc = "Redisplay all cells (after the data changed)." },
    { sig = "refreshCell(row: int, column: int)", cpp = "{self}->refreshCell({row}, {column})", doc = "Redisplay one cell." },
    { sig = "dataText(row: int, column: int) -> string", cpp = "{self}->data({self}->index({row}, {column}), Qt::DisplayRole).toString()", doc = "The text of a cell, as the view would show it (asks the `dataRequested` slots)." },
    { sig = "setDataText(row: int, column: int, text: string) -> bool", cpp = "{self}->setData({self}->index({row}, {column}), {text}, Qt::EditRole)", doc = "Edit a cell as the user would (calls the `dataEdited` slots); false if not accepted." },
]

