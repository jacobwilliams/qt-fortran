[[class]]
name = "QTreeView"
base = "QAbstractItemView"
doc = """
A tree view of a model: a QtfTreeModel (Fortran data), a QFileSystemModel
(files), or a QSortFilterProxyModel over either.

With a QtfTreeModel, nodes are the model's node numbers (through any proxy):
see `nodeClicked`, `currentNodeChanged`, `setCurrentNode`, `expandNode`. With
a QFileSystemModel, files are paths: see `currentFileChanged`, `fileActivated`
and `setRootPath`."""
ctor = "(parent: QWidget?) -- Create a tree view."
cpp_ctor = "new QtfTreeView({parent})"
signals = [
    { sig = "nodeClicked: custom", fortran_type = "QSignalInt", cpp_signal = "&QTreeView::clicked", lambda = "const QModelIndex &i", emit = "qtf_emit_int(ref, qtf_node(i))", doc = "A node of a QtfTreeModel was clicked." },
    { sig = "nodeActivated: custom", fortran_type = "QSignalInt", cpp_signal = "&QTreeView::activated", lambda = "const QModelIndex &i", emit = "qtf_emit_int(ref, qtf_node(i))", doc = "A node was activated (double click or Enter)." },
    { sig = "currentNodeChanged: int", connector = "connect_tree<false>", doc = "The current node changed (-1 if none, or not a QtfTreeModel)." },
    { sig = "currentFileChanged: string", connector = "connect_tree<true>", doc = "The current file of a QFileSystemModel changed: its path." },
    { sig = "fileActivated: custom", fortran_type = "QSignalString", cpp_signal = "&QTreeView::activated", lambda = "const QModelIndex &i", emit = "qtf_emit(ref, qtf_file_path(i))", doc = "A file of a QFileSystemModel was activated (double click or Enter): its path." },
    { sig = "expandedNode: custom", fortran_type = "QSignalInt", cpp_signal = "&QTreeView::expanded", lambda = "const QModelIndex &i", emit = "qtf_emit_int(ref, qtf_node(i))", doc = "A node was expanded." },
    { sig = "collapsedNode: custom", fortran_type = "QSignalInt", cpp_signal = "&QTreeView::collapsed", lambda = "const QModelIndex &i", emit = "qtf_emit_int(ref, qtf_node(i))", doc = "A node was collapsed." },
]
methods = [
    { sig = "currentNode() -> int", cpp = "qtf_node({self}->currentIndex())", doc = "The current node of a QtfTreeModel (-1 if none)." },
    { sig = "setCurrentNode(node: int)", cpp = "{self}->setCurrentIndex(qtf_node_index({self}, {node}))", doc = "Make `node` current (its parents are expanded)." },
    { sig = "expandNode(node: int)", cpp = "{self}->expand(qtf_node_index({self}, {node}))", doc = "Expand a node." },
    { sig = "collapseNode(node: int)", cpp = "{self}->collapse(qtf_node_index({self}, {node}))", doc = "Collapse a node." },
    { sig = "isNodeExpanded(node: int) -> bool", cpp = "{self}->isExpanded(qtf_node_index({self}, {node}))", doc = "True if the node is expanded." },
    { sig = "scrollToNode(node: int)", cpp = "{self}->scrollTo(qtf_node_index({self}, {node}))", doc = "Scroll so that the node is visible (expanding its parents)." },
    { sig = "currentFilePath() -> string", cpp = "qtf_file_path({self}->currentIndex())", doc = "The path of the current file of a QFileSystemModel (empty if none)." },
    { sig = "setCurrentFile(path: string)", cpp = "qtf_set_current_file({self}, {path})", doc = "Make the file `path` of the QFileSystemModel current." },
    { sig = "setRootPath(path: string)", cpp = "qtf_set_root_path({self}, {path})", doc = "Show only the directory `path` of the QFileSystemModel (set the model's root path too)." },
    "expandAll() -- Expand every node.",
    "collapseAll() -- Collapse every node.",
    "expandToDepth(depth: int) -- Expand nodes down to `depth` levels (0: the top level).",
    "setHeaderHidden(hide: bool) -- Hide the column titles.",
    "setRootIsDecorated(show: bool) -- Show expand/collapse controls for top-level nodes.",
    "setUniformRowHeights(uniform: bool) -- Promise equal row heights (faster for large trees).",
    "setAnimated(enable: bool) -- Animate expanding and collapsing.",
    "setIndentation(pixels: int) -- Indentation per level.",
    "resizeColumnToContents(column: int) -- Fit a column's width to its contents.",
    "setColumnWidth(column: int, width: int) -- Set a column width in pixels.",
    "setColumnHidden(column: int, hide: bool) -- Hide or show a column.",
    "setSortingEnabled(enable: bool) -- Sort when a column title is clicked (needs a sorting model, e.g. QSortFilterProxyModel).",
    "sortByColumn(column: int, order: Qt::SortOrder) -- Sort by a column now.",
]

[[class]]
name = "QtfTreeModel"
base = "QAbstractItemModel"
doc = """
A tree model whose structure is a Fortran parent array and whose cells come
from Fortran on demand (`Qtf` marks a qt-fortran class). Nodes are numbered
1..n in the order given: `parents(i)` is node i's parent (0 for a top-level
node), and a parent comes before its children. Children appear in node order.
Connect `dataRequested` (slots get (node, column, request)) as for
QtfTableModel; only visible cells are requested."""
ctor = "(columns: int = 1, parent: QObject?) -- An empty tree model with `columns` columns."
cpp_ctor = "new QtfTreeModel({columns}, {parent})"
signals = [
    { sig = "dataRequested: custom", fortran_type = "QSignalModelData", connector = "connect_model<0>", doc = "A cell is needed: slots get (node, column, request) and set the request's value." },
    { sig = "dataEdited: custom", fortran_type = "QSignalModelEdit", connector = "connect_model<1>", doc = "The user edited a cell: slots get (node, column, text)." },
]
methods = [
    { sig = "setParents(parents: int[])", cpp = "{self}->setParents({parents}, {n})", doc = "Set the structure: node i's parent is `parents(i)` (0: top level; must be < i). Resets the views." },
    { sig = "appendNode(parent: int) -> int", cpp = "{self}->appendNode({parent})", doc = "Add a node as the last child of `parent` (0: top level); returns its number (-1 if `parent` is invalid)." },
    { sig = "nodeCount() -> int", cpp = "{self}->nodeCount()", doc = "The number of nodes." },
    { sig = "parentNode(node: int) -> int", cpp = "({node} >= 1 && {node} <= {self}->nodeCount()) ? {self}->parent_of[{node}] : -1", doc = "The parent of a node (0: top level; -1 if invalid)." },
    { sig = "childCount(node: int) -> int", cpp = "({node} >= 0 && {node} <= {self}->nodeCount()) ? int({self}->children[{node}].size()) : 0", doc = "The number of children of a node (0: the top-level nodes)." },
    { sig = "setColumnCount(columns: int)", cpp = "{self}->setColumns({columns})", doc = "Set the number of columns." },
    { sig = "setHeaderLabels(labels: strings)", cpp = "{self}->setHeaders({labels})", doc = "Set the column titles." },
    { sig = "setEditable(editable: bool)", cpp = "{self}->editable = {editable}", doc = "Allow editing cells (edits arrive at `dataEdited`)." },
    { sig = "refresh()", cpp = "{self}->refresh()", doc = "Redisplay all cells (after the data changed)." },
    { sig = "refreshNode(node: int)", cpp = "{self}->refreshNode({node})", doc = "Redisplay one node's cells." },
    { sig = "dataText(node: int, column: int) -> string", cpp = "{self}->data({self}->nodeIndex({node}, {column}), Qt::DisplayRole).toString()", doc = "The text of a cell, as a view would show it." },
]

[[class]]
name = "QSortFilterProxyModel"
base = "QAbstractItemModel"
doc = """
Sorts and filters another model for a view: `proxy%setSourceModel(model)`,
then `view%setModel(proxy)`. Rows in the view (and in the view's signals) are
then the proxy's: map them with `mapToSourceRow`. Numbers set with
`request%setNumber` sort numerically. Filtering and sorting ask the source for
every row of the key column, so for very large Fortran tables sorting through
QtfTableModel's `sortRequested` is faster."""
ctor = "(parent: QObject?) -- A proxy model (set its source model)."
methods = [
    "setSourceModel(model: QAbstractItemModel) -- The model to sort and filter.",
    "setFilterFixedString(pattern: string) -- Show only rows whose key column contains `pattern` (empty: all rows).",
    { sig = "setFilterRegularExpression(pattern: string)", cpp = "{self}->setFilterRegularExpression(QRegularExpression({pattern}))", doc = "Show only rows whose key column matches a regular expression." },
    "setFilterWildcard(pattern: string) -- Show only rows whose key column matches a wildcard pattern (`*`, `?`).",
    "setFilterKeyColumn(column: int) -- The column the filter looks at (-1: any column).",
    "setFilterCaseSensitivity(cs: Qt::CaseSensitivity) -- Qt_CaseInsensitive or Qt_CaseSensitive (default).",
    "setSortCaseSensitivity(cs: Qt::CaseSensitivity) -- Case sensitivity when sorting text.",
    "setRecursiveFilteringEnabled(recursive: bool) -- For trees: keep the parents of matching nodes.",
    "setDynamicSortFilter(enable: bool) -- Re-sort and re-filter when the source changes (default true).",
    { sig = "sort(column: int, order: Qt::SortOrder = Qt_AscendingOrder)", cpp = "{self}->sort({column}, Qt::SortOrder({order}))", doc = "Sort by a column (-1: source order)." },
    "invalidate() -- Re-sort and re-filter now.",
    { sig = "mapToSourceRow(row: int, column: int = 0) -> int", cpp = "qtf_proxy_to_source({self}, {row}, {column})", doc = "The source model's row for a proxy row (-1 if invalid)." },
    { sig = "mapFromSourceRow(row: int, column: int = 0) -> int", cpp = "qtf_proxy_from_source({self}, {row}, {column})", doc = "The proxy row of a source row (-1 if filtered out)." },
]

[[class]]
name = "QFileSystemModel"
