name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Raw interfaces match the shim
        if: runner.os == 'Linux'
        run: pixi run gen-check

      - name: Docstrings and implicit none
        if: runner.os == 'Linux'
        run: pixi run lint

      - name: Build library and examples
        run: pixi run build

      - name: Test (headless)
        run: pixi run test

      # OpenGL needs a real display; only the macOS runners have a window server.
      # The test prints SKIP if no OpenGL 3.3 context is available.
      - name: Test OpenGL
        if: runner.os == 'macOS'
        run: pixi run test-gl
