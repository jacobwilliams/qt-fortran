name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Raw interfaces match the shim
        if: runner.os == 'Linux'
        run: pixi run gen-check

      - name: Docstrings and implicit none
        if: runner.os == 'Linux'
        run: pixi run lint

      - name: Build library and examples
        run: pixi run build

      - name: Test (headless)
        run: pixi run test

      - name: Use qt-fortran from another fpm project
        working-directory: ci/consumer
        run: pixi run --manifest-path ../../pixi.toml python ../../tools/fpm_qt.py run
        env:
          QT_QPA_PLATFORM: offscreen

      # OpenGL needs a real display; only the macOS runners have a window server.
      # The test prints SKIP if no OpenGL 3.3 context is available.
      - name: Test OpenGL
        if: runner.os == 'macOS'
        run: pixi run test-gl

  # Intel Fortran (ifx) on Windows, with conda-forge's MSVC-built Qt
  windows-ifx:
    name: windows-latest (ifx)
    runs-on: windows-latest
    env:
      ONEAPI_ROOT: C:\Program Files (x86)\Intel\oneAPI
      IFX_VERSION: '2025.3'
    steps:
      - uses: actions/checkout@v7.0.1

      # setup-fortran caches the oneAPI install under a key that changes daily,
      # so it reinstalls (~9 min) at least once a day. Cache it under a fixed
      # key instead, and run setup-fortran only when that misses.
      - name: Restore oneAPI
        id: oneapi
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ONEAPI_ROOT }}
          key: oneapi-ifx-${{ env.IFX_VERSION }}-${{ runner.os }}-v1

      - name: Install ifx
        if: steps.oneapi.outputs.cache-hit != 'true'
        uses: fortran-lang/setup-fortran@v1.11.0
        with:
          compiler: intel
          version: ${{ env.IFX_VERSION }}

      - name: Save oneAPI
        if: steps.oneapi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ONEAPI_ROOT }}
          key: ${{ steps.oneapi.outputs.cache-primary-key }}

      # what setup-fortran does after restoring its own cache
      - name: Activate oneAPI (cached install)
        if: steps.oneapi.outputs.cache-hit == 'true'
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat"
          set | findstr /c:"oneAPI" >> "%GITHUB_ENV%"
          echo SETVARS_COMPLETED=1>>"%GITHUB_ENV%"

      - name: Hide Git's GNU link (cached install)
        if: steps.oneapi.outputs.cache-hit == 'true'
        shell: bash
        run: mv /usr/bin/link "$RUNNER_TEMP/link"

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Compiler versions
        run: |
          ifx --version
          pixi run fpm --version

      - name: Build library and examples
        run: pixi run python tools/fpm_qt.py build --compiler ifx

      - name: Test (headless)
        run: pixi run python tools/fpm_qt.py test --compiler ifx
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Use qt-fortran from another fpm project
        working-directory: ci/consumer
        run: pixi run --manifest-path ../../pixi.toml python ../../tools/fpm_qt.py run --compiler ifx
        env:
          QT_QPA_PLATFORM: offscreen
